<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎉 Kuis Anak Cerdas!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0221;
  --card:#ffffff0e;
  --gold:#FFD700;
  --green:#00E676;
  --red:#FF1744;
  --blue:#00B0FF;
  --purple:#E040FB;
  --orange:#FF6D00;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;font-family:'Nunito',sans-serif;background:var(--bg);color:#fff;overflow-x:hidden;}

/* animated bg */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 10%,rgba(224,64,251,.2) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%,rgba(0,176,255,.15) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 50%,rgba(255,109,0,.08) 0%,transparent 70%);
  animation:bgShift 8s ease-in-out infinite alternate;
}
@keyframes bgShift{
  0%{opacity:.7}100%{opacity:1}
}

/* stars */
.star{position:fixed;pointer-events:none;z-index:0;font-size:.7rem;
  animation:starTwinkle linear infinite;}
@keyframes starTwinkle{
  0%,100%{opacity:.1;transform:scale(.8)}
  50%{opacity:.5;transform:scale(1.2)}
}

/* ── WRAPPER ── */
#app{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;
}

/* ── SCREENS ── */
.screen{width:100%;max-width:480px;animation:scrIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes scrIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ── CARD ── */
.card{
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:28px 22px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* ── LOGO ── */
.logo-wrap{text-align:center;margin-bottom:20px;}
.logo-emoji{font-size:3.5rem;display:block;animation:logoFloat 2s ease-in-out infinite;}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-title{
  font-family:'Fredoka One',cursive;
  font-size:2.2rem;letter-spacing:2px;
  background:linear-gradient(135deg,#FFD700,#FF6D00,#FF3CAC);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,165,0,.4));
  line-height:1.1;
}
.logo-sub{font-size:.65rem;font-weight:800;letter-spacing:4px;color:rgba(255,255,255,.35);margin-top:4px;}

/* ── FORM ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:.65rem;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.4);margin-bottom:6px;}
.field input{
  width:100%;padding:12px 16px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  border-radius:14px;color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;
  outline:none;transition:border-color .2s;
}
.field input:focus{border-color:rgba(255,215,0,.5);}
.field input::placeholder{color:rgba(255,255,255,.25);}

/* ── BUTTONS ── */
.btn{
  width:100%;padding:14px;border:none;border-radius:50px;
  font-family:'Fredoka One',cursive;font-size:1.2rem;letter-spacing:1px;
  cursor:pointer;transition:all .15s;display:block;
}
.btn:active{transform:scale(.96);}
.btn-primary{
  background:linear-gradient(135deg,#FF6D00,#FF3CAC);color:#fff;
  box-shadow:0 6px 24px rgba(255,109,0,.4);margin-top:6px;
}
.btn-primary:hover{box-shadow:0 8px 28px rgba(255,109,0,.6);}
.btn-sound{
  background:rgba(224,64,251,.2);border:1.5px solid rgba(224,64,251,.4);
  color:#E040FB;font-family:'Nunito',sans-serif;font-weight:800;
  font-size:.85rem;padding:9px;border-radius:50px;margin-bottom:16px;
}

/* age selector */
.age-row{display:flex;gap:8px;flex-wrap:wrap;}
.age-btn{
  flex:1;min-width:40px;padding:10px 6px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:12px;color:rgba(255,255,255,.5);font-family:'Fredoka One',cursive;
  font-size:1.1rem;cursor:pointer;transition:all .15s;text-align:center;
}
.age-btn.sel{
  background:rgba(255,215,0,.2);border-color:#FFD700;color:#FFD700;
  box-shadow:0 0 12px rgba(255,215,0,.3);
}

/* ── LEVEL LADDER ── */
.ladder{display:flex;flex-direction:column;gap:4px;margin-bottom:18px;}
.ladder-row{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  transition:all .3s;
}
.ladder-row.active{
  background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.4);
  box-shadow:0 0 16px rgba(255,215,0,.2);
}
.ladder-row.done{background:rgba(0,230,118,.08);border-color:rgba(0,230,118,.3);}
.ladder-num{font-family:'Fredoka One',cursive;font-size:.8rem;width:20px;
  color:rgba(255,255,255,.3);}
.ladder-row.active .ladder-num{color:#FFD700;}
.ladder-row.done .ladder-num{color:#00E676;}
.ladder-label{font-size:.75rem;font-weight:800;flex:1;color:rgba(255,255,255,.4);}
.ladder-row.active .ladder-label{color:#fff;}
.ladder-row.done .ladder-label{color:#00E676;}
.ladder-prize{font-family:'Fredoka One',cursive;font-size:.85rem;color:rgba(255,255,255,.25);}
.ladder-row.active .ladder-prize{color:#FFD700;}
.ladder-row.done .ladder-prize{color:#00E676;}
.ladder-ico{font-size:.9rem;}

/* ── QUIZ SCREEN ── */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.q-level{
  font-family:'Fredoka One',cursive;font-size:1rem;letter-spacing:1px;
  background:rgba(255,215,0,.15);border:1.5px solid rgba(255,215,0,.3);
  border-radius:50px;padding:4px 16px;color:#FFD700;
}
.q-prize{
  font-family:'Fredoka One',cursive;font-size:1rem;
  color:#00E676;text-shadow:0 0 10px rgba(0,230,118,.4);
}

/* timer ring */
.timer-wrap{display:flex;justify-content:center;margin-bottom:14px;position:relative;}
.timer-ring{transform:rotate(-90deg);}
.timer-ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:5;}
.timer-ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .5s;}
.timer-num{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Fredoka One',cursive;font-size:2rem;
  transition:color .3s;
}

/* question */
.q-cat{font-size:.55rem;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.3);margin-bottom:8px;text-align:center;}
.q-text{
  font-size:1.25rem;font-weight:800;line-height:1.4;text-align:center;
  margin-bottom:18px;color:#fff;
}

/* answer buttons */
.answers{display:flex;flex-direction:column;gap:8px;}
.ans-btn{
  padding:13px 16px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);
  border-radius:16px;color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;
  cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:10px;
}
.ans-btn:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:rgba(255,215,0,.5);transform:scale(1.02);}
.ans-btn:active:not(:disabled){transform:scale(.97);}
.ans-btn.correct{background:rgba(0,230,118,.2);border-color:#00E676;color:#00E676;box-shadow:0 0 20px rgba(0,230,118,.3);}
.ans-btn.wrong{background:rgba(255,23,68,.15);border-color:#FF1744;color:#FF5252;}
.ans-btn:disabled{cursor:not-allowed;}
.ans-label{
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:.85rem;flex-shrink:0;
}
.ans-btn.correct .ans-label{background:rgba(0,230,118,.3);}
.ans-btn.wrong .ans-label{background:rgba(255,23,68,.3);}

/* lifelines */
.lifelines{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.ll-btn{
  padding:7px 14px;border-radius:50px;
  background:rgba(0,176,255,.15);border:1.5px solid rgba(0,176,255,.3);
  color:#00B0FF;font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;
  cursor:pointer;transition:all .15s;
}
.ll-btn:hover:not(:disabled){background:rgba(0,176,255,.3);}
.ll-btn:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(1);}

/* ── RESULT FEEDBACK ── */
.feedback{
  text-align:center;padding:14px;border-radius:16px;margin-bottom:12px;
  animation:fdIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fdIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.feedback.correct{background:rgba(0,230,118,.1);border:1.5px solid rgba(0,230,118,.3);}
.feedback.wrong{background:rgba(255,23,68,.1);border:1.5px solid rgba(255,23,68,.3);}
.feedback-ico{font-size:2.5rem;display:block;margin-bottom:4px;}
.feedback-title{font-family:'Fredoka One',cursive;font-size:1.5rem;}
.feedback.correct .feedback-title{color:#00E676;}
.feedback.wrong .feedback-title{color:#FF5252;}
.feedback-sub{font-size:.8rem;font-weight:700;color:rgba(255,255,255,.5);margin-top:4px;}

/* ── FINISH SCREEN ── */
.finish-hero{font-size:4rem;display:block;text-align:center;animation:heroSpin 1s cubic-bezier(.34,1.56,.64,1);}
@keyframes heroSpin{from{transform:rotate(-20deg) scale(0)}to{transform:rotate(0) scale(1)}}
.finish-name{font-family:'Fredoka One',cursive;font-size:2rem;text-align:center;
  background:linear-gradient(135deg,#FFD700,#FF6D00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:6px 0;}
.finish-total{
  text-align:center;margin:16px 0;padding:16px;
  background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.3);border-radius:20px;
}
.ft-lbl{font-size:.55rem;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.35);}
.ft-val{font-family:'Fredoka One',cursive;font-size:2.8rem;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.5);}
.ft-sub{font-size:.8rem;font-weight:700;color:rgba(255,255,255,.4);}

.result-breakdown{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.rb-row{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:rgba(255,255,255,.04);border-radius:10px;}
.rb-ico{font-size:1.1rem;}
.rb-label{font-size:.75rem;font-weight:800;flex:1;color:rgba(255,255,255,.5);}
.rb-val{font-family:'Fredoka One',cursive;font-size:.95rem;color:#FFD700;}
.rb-val.green{color:#00E676;}

/* ── CONFETTI ── */
#confCv{position:fixed;inset:0;pointer-events:none;z-index:50;}

/* ── SHAKE ── */
.shake{animation:shk .4s ease;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* ── PROGRESS BAR ── */
.prog-wrap{height:5px;background:rgba(255,255,255,.08);border-radius:5px;margin-bottom:16px;overflow:hidden;}
.prog-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#FF6D00,#FFD700);transition:width .5s ease;}

/* safe haven badge */
.safe-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);
  border-radius:50px;padding:3px 10px;font-size:.6rem;font-weight:800;letter-spacing:2px;color:#00E676;
  margin-bottom:10px;
}
</style>
</head>
<body>

<div id="app">
  <div id="screen" class="screen"></div>
</div>
<canvas id="confCv"></canvas>

<script>
// =============================================
// STARS BG
// =============================================
for(let i=0;i<30;i++){
  const s=document.createElement('div');
  s.className='star';s.textContent='⭐';
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${.4+Math.random()*.5}rem;animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*3}s;`;
  document.body.appendChild(s);
}

// =============================================
// AUDIO
// =============================================
let _ac=null,soundOn=false;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function beep(f,d,t,v,dl){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t||'sine';o.frequency.setValueAtTime(f,a.currentTime+(dl||0));g.gain.setValueAtTime(v||.3,a.currentTime+(dl||0));g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(dl||0)+d);o.start(a.currentTime+(dl||0));o.stop(a.currentTime+(dl||0)+d+.05);}catch(e){}}
function enableSound(){
  try{ac();soundOn=true;beep(600,.1,'sine',.3);}catch(e){}
  document.querySelector('.btn-sound')?.remove();
}
function sndCorrect(){beep(523,.1,'triangle',.4);beep(659,.1,'triangle',.35,.1);beep(784,.15,'triangle',.4,.18);beep(1047,.2,'triangle',.45,.3);}
function sndWrong(){beep(300,.15,'sawtooth',.4);beep(180,.3,'sawtooth',.35,.1);}
function sndTick(){beep(880,.04,'square',.1);}
function sndTickUrgent(){beep(1100,.05,'square',.2);}
function sndWin(){[523,659,784,1047,1319].forEach((f,i)=>beep(f,.15,'triangle',.4,i*.12));}
function sndBonus(){[784,1047,1319,1568,2093].forEach((f,i)=>beep(f,.12,'triangle',.5,i*.09));}
function sndLevelUp(){beep(659,.08,'triangle',.3);beep(784,.08,'triangle',.3,.1);beep(1047,.2,'sine',.5,.2);}

// =============================================
// TTS
// =============================================
function speak(text,rate=1.05,cb=null){
  if(!soundOn){cb&&cb();return;}
  window.speechSynthesis?.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='id-ID';u.rate=rate;
  u.onend=()=>cb&&cb();
  window.speechSynthesis?.speak(u);
}
function verbal(q){return q.replace(/\+/g,' tambah ').replace(/-/g,' kurang ').replace(/x/g,' kali ').replace(/:/g,' bagi ');}
function terbilang(n){
  const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan'];
  if(n<10)return s[n];
  if(n<20)return n===10?'sepuluh':n===11?'sebelas':s[n-10]+' belas';
  if(n<100)return s[Math.floor(n/10)]+' puluh '+terbilang(n%10);
  if(n<200)return 'seratus '+terbilang(n-100);
  if(n<1000)return s[Math.floor(n/100)]+' ratus '+terbilang(n%100);
  if(n<2000)return 'seribu '+terbilang(n-1000);
  if(n<1000000)return terbilang(Math.floor(n/1000))+' ribu '+terbilang(n%1000);
  return '';
}

// LEVELS

  {num:1, label:'Pemanasan',    prize:500,   safe:false, color:'#69F0AE', emoji:'🌱'},
  {num:2, label:'Mudah',        prize:1000,  safe:false, color:'#40C4FF', emoji:'😊'},
  {num:3, label:'Lumayan',      prize:2000,  safe:true,  color:'#FFD740', emoji:'🤔'},
  {num:4, label:'Seru!',        prize:5000,  safe:false, color:'#FF6D00', emoji:'🔥'},
  {num:5, label:'Menantang',    prize:10000, safe:true,  color:'#FF3CAC', emoji:'💪'},
  {num:6, label:'Super Susah',  prize:20000, safe:false, color:'#E040FB', emoji:'🤯'},
  {num:7, label:'BONUS MASTER', prize:50000, safe:false, color:'#FFD700', emoji:'👑'},

// CONFETTI
// =============================================
const ccv=document.getElementById('confCv');
const cctx=ccv.getContext('2d');
let cp=[],cr=null;
function launchConf(){
  ccv.width=window.innerWidth;ccv.height=window.innerHeight;cp=[];
  const cols=['#FFD700','#FF3CAC','#00E676','#00B0FF','#FF6D00','#E040FB','#fff'];
  for(let i=0;i<160;i++) cp.push({x:Math.random()*ccv.width,y:-30,vx:(Math.random()-.5)*7,vy:2+Math.random()*6,r:3+Math.random()*7,col:cols[i%cols.length],rot:Math.random()*360,rv:(Math.random()-.5)*12});
  cancelAnimationFrame(cr);animC();
  setTimeout(()=>{cancelAnimationFrame(cr);cctx.clearRect(0,0,ccv.width,ccv.height);},5000);
}
function animC(){
  cctx.clearRect(0,0,ccv.width,ccv.height);
  cp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.rot+=p.rv;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot*Math.PI/180);cctx.fillStyle=p.col;cctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cctx.restore();});
  cp=cp.filter(p=>p.y<ccv.height+30);
  if(cp.length>0) cr=requestAnimationFrame(animC);
}

function render(html){
  const s=document.getElementById('screen');
  s.innerHTML=`<div class="card">${html}</div>`;
}

// =============================================
function showStart(){
  render(`
    <button class="btn btn-sound" onclick="enableSound()">🔊 Aktifkan Suara Dulu</button>
    <div class="logo-wrap">
      <span class="logo-emoji">🏆</span>
      <div class="logo-title">KUIS ANAK<br>CERDAS!</div>
      <div class="logo-sub">SIAPA YANG PALING PINTAR?</div>
    </div>
    <div class="field">
      <label>NAMA KAMU</label>
      <input id="nameInp" placeholder="Masukkan namamu..." maxlength="20">
    </div>
    <div class="field">
      <label>UMUR</label>
      <div class="age-row" id="ageRow">
        ${[4,5,6,7,8,9,10,12,15,17,20,25].map((a,idx)=>`<div class="age-btn${idx===0?' sel':''}" onclick="pickAge(${a},this)">${a}</div>`).join('')}
      </div>
    </div>
    <button class="btn btn-primary" onclick="startGame()">🚀 MULAI KUIS!</button>
  `);
  playerAge=4;
}

function pickAge(a,el){
  playerAge=a;
  document.querySelectorAll('.age-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

function startGame(){
  playerName=document.getElementById('nameInp')?.value.trim()||'';
  if(!playerName){
    document.getElementById('nameInp').style.borderColor='#FF1744';
    document.getElementById('nameInp').placeholder='Tulis namamu dulu ya!';
    return;
  }
  currentLevel=0; totalMoney=0; usedQuestions=[];
  lifeline50=true; lifelineCall=true; correctCount=0; safeHavenMoney=0;
  showLadder();
}

function showLadder(){
  const ladderHTML = LEVELS.map((l,i)=>{
    let cls='';
    if(i===currentLevel) cls='active';
    else if(i<currentLevel) cls='done';
    return `<div class="ladder-row ${cls}">
      <div class="ladder-num">${i<currentLevel?'✅':i===currentLevel?'▶':l.num}</div>
      <div>
        <div class="ladder-label">${l.emoji} ${l.label}</div>
        ${l.safe?'<span class="safe-badge">🛡️ AMAN</span>':''}
      </div>
      <div class="ladder-prize">Rp ${l.prize.toLocaleString('id')}</div>
    </div>`;
  }).reverse().join('');

  render(`
    <div style="text-align:center;margin-bottom:12px;">
      <div style="font-family:'Fredoka One',cursive;font-size:1.4rem;color:#FFD700;">Halo, ${playerName}! 👋</div>
      <div style="font-size:.7rem;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.35);margin-top:2px;">UMUR ${playerAge} TAHUN</div>
    </div>
    <div class="ladder">${ladderHTML}</div>
    <button class="btn btn-primary" onclick="loadQuestion()">▶ ${currentLevel===0?'MULAI!':'LANJUT!'}</button>
  `);
}

// =============================================
// QUESTION
// =============================================
function loadQuestion(){
  const lvl=LEVELS[currentLevel];
  const avail=QUESTIONS.filter(q=>playerAge>=q.min&&playerAge<=q.max&&!usedQuestions.includes(q.q));
  if(avail.length===0){ finishGame(true); return; }
  currentQ=avail[Math.floor(Math.random()*avail.length)];
  usedQuestions.push(currentQ.q);
  timeLeft=currentLevel>=4?12:15;
  showQuestion();
}

function showQuestion(){
  const lvl=LEVELS[currentLevel];
  const prog=((currentLevel)/LEVELS.length)*100;
  const labels=['A','B','C','D'];
  const opts=currentQ.opts.map((o,i)=>`
    <button class="ans-btn" id="ans${i}" data-idx="${i}" onclick="answerByIndex(${i})">
      <span class="ans-label">${labels[i]}</span>${o}
    </button>`).join('');

  render(`
    <div class="prog-wrap"><div class="prog-fill" style="width:${prog}%"></div></div>
    <div class="quiz-header">
      <div class="q-level" style="color:${lvl.color};border-color:${lvl.color}44;background:${lvl.color}18">
        ${lvl.emoji} Level ${lvl.num}
      </div>
      <div class="q-prize" style="color:${lvl.color}">Rp ${lvl.prize.toLocaleString('id')}</div>
    </div>
    <div class="timer-wrap">
      <svg class="timer-ring" width="70" height="70" viewBox="0 0 70 70">
        <circle class="timer-ring-bg" cx="35" cy="35" r="30"/>
        <circle class="timer-ring-fill" id="timerRing" cx="35" cy="35" r="30"
          stroke="${lvl.color}"
          stroke-dasharray="${2*Math.PI*30}"
          stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="timerNum" style="color:${lvl.color}">${timeLeft}</div>
    </div>
    <div class="q-cat">${currentQ.cat}</div>
    <div class="q-text">${currentQ.q}</div>
    <div class="lifelines">
      <button class="ll-btn" id="ll50" onclick="useLifeline50()" ${!lifeline50?'disabled':''}>
        ${lifeline50?'🎯 50:50':'🎯 Terpakai'}
      </button>
      <button class="ll-btn" id="llCall" onclick="useLifelineCall()" ${!lifelineCall?'disabled':''}>
        ${lifelineCall?'📞 Telepon':'📞 Terpakai'}
      </button>
    </div>
    <div class="answers">${opts}</div>
  `);

  startTimer();
  if(soundOn) speak(verbal(currentQ.q),1.05);
}

// =============================================
// TIMER
// =============================================
function startTimer(){
  clearInterval(timerInterval);
  const total=timeLeft;
  const circ=2*Math.PI*30;
  timerInterval=setInterval(()=>{
    timeLeft--;
    const el=document.getElementById('timerNum');
    const ring=document.getElementById('timerRing');
    if(el) el.textContent=timeLeft;
    if(ring) ring.style.strokeDashoffset=circ*(1-(timeLeft/total));
    if(timeLeft<=5){
      if(el) el.style.color='#FF1744';
      if(ring) ring.style.stroke='#FF1744';
      sndTickUrgent();
    } else {
      sndTick();
    }
    if(timeLeft<=0){
      clearInterval(timerInterval);
      timeOutAnswer();
    }
  },1000);
}

function timeOutAnswer(){
  disableAnswers();
  // Show correct answer
  currentQ.opts.forEach((o,i)=>{
    if(o===currentQ.a) document.getElementById('ans'+i)?.classList.add('correct');
  });
  sndWrong();
  setTimeout(()=>showFeedback(false,true),400);
}

// =============================================
// ANSWER
// =============================================
function answerByIndex(i){
  if(!currentQ) return;
  answer(currentQ.opts[i]);
}
function answer(val){
  clearInterval(timerInterval);
  disableAnswers();
  const isCorrect=(val===currentQ.a);

  // Highlight
  currentQ.opts.forEach((o,i)=>{
    const btn=document.getElementById('ans'+i);
    if(!btn) return;
    if(o===currentQ.a) btn.classList.add('correct');
    else if(o===val&&!isCorrect) btn.classList.add('wrong');
  });

  if(isCorrect){
    sndCorrect();
    setTimeout(()=>showFeedback(true,false),500);
  } else {
    sndWrong();
    setTimeout(()=>showFeedback(false,false),500);
  }
}

function disableAnswers(){
  document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
  document.getElementById('ll50')?.setAttribute('disabled',true);
  document.getElementById('llCall')?.setAttribute('disabled',true);
}

function showFeedback(correct, timeout){
  const lvl=LEVELS[currentLevel];
  if(correct){
    totalMoney+=lvl.prize;
    correctCount++;
    if(lvl.safe) safeHavenMoney=totalMoney;
    sndLevelUp();
    render(`
      <div class="feedback correct">
        <span class="feedback-ico">🎉</span>
        <div class="feedback-title">BETUL!</div>
        <div class="feedback-sub">+Rp ${lvl.prize.toLocaleString('id')} • Total: Rp ${totalMoney.toLocaleString('id')}</div>
      </div>
      <div style="text-align:center;font-size:.85rem;font-weight:800;color:rgba(255,255,255,.5);margin-bottom:10px;">
        Jawaban: <span style="color:#00E676">${currentQ.a}</span>
      </div>
      <button class="btn btn-primary" onclick="nextLevel()">${currentLevel>=LEVELS.length-1?'🏆 LIHAT HASIL':'▶ LEVEL BERIKUTNYA'}</button>
    `);
  } else {
    // Use safe haven money
    const keep=safeHavenMoney;
    render(`
      <div class="feedback wrong">
        <span class="feedback-ico">${timeout?'⏰':'😢'}</span>
        <div class="feedback-title">${timeout?'WAKTU HABIS!':'SALAH!'}</div>
        <div class="feedback-sub">Jawaban: <span style="color:#FF5252">${currentQ.a}</span></div>
      </div>
      ${keep>0?`<div style="text-align:center;font-size:.8rem;font-weight:800;color:#00E676;margin-bottom:10px;">
        🛡️ Kamu dapat uang aman: Rp ${keep.toLocaleString('id')}</div>`:''}
      <button class="btn btn-primary" onclick="finishGame(false)">📊 Lihat Hasil</button>
    `);
    const card=document.querySelector('.card');
    card?.classList.add('shake');
    setTimeout(()=>card?.classList.remove('shake'),400);
  }
}

// =============================================
// LIFELINES
// =============================================
function useLifeline50(){
  if(!lifeline50||!currentQ) return;
  lifeline50=false;
  document.getElementById('ll50').disabled=true;
  document.getElementById('ll50').textContent='🎯 Terpakai';

  // Remove 2 wrong answers
  let removed=0;
  currentQ.opts.forEach((o,i)=>{
    if(o!==currentQ.a&&removed<2){
      const btn=document.getElementById('ans'+i);
      if(btn&&!btn.disabled){
        btn.style.opacity='0.2';
        btn.disabled=true;
        removed++;
      }
    }
  });
  beep(660,.1,'triangle',.3);
}

function useLifelineCall(){
  if(!lifelineCall||!currentQ) return;
  lifelineCall=false;
  document.getElementById('llCall').disabled=true;
  document.getElementById('llCall').textContent='📞 Terpakai';

  // Flash the correct answer
  const idx=currentQ.opts.indexOf(currentQ.a);
  const btn=document.getElementById('ans'+idx);
  if(btn){
    let flash=0;
    const iv=setInterval(()=>{
      btn.style.background=flash%2===0?'rgba(255,215,0,.3)':'';
      flash++;
      if(flash>5) clearInterval(iv);
    },200);
  }
  speak(`Menurutku jawabannya adalah ${currentQ.a}`,1);
}

// =============================================
// LEVEL PROGRESS
// =============================================
function nextLevel(){
  currentLevel++;
  if(currentLevel>=LEVELS.length){ finishGame(true); return; }
  showLadder();
}

// =============================================
// FINISH
// =============================================
function finishGame(completed){
  clearInterval(timerInterval);
  const finalMoney=completed?totalMoney:safeHavenMoney;

  if(finalMoney>0||completed){
    launchConf();
    sndWin();
    if(completed) sndBonus();
  }

  const rankStr=correctCount>=6?'🏆 JUARA!':correctCount>=4?'⭐ HEBAT!':correctCount>=2?'👍 BAGUS!':'💪 TERUS BELAJAR!';

  render(`
    <span class="finish-hero">${completed?'🏆':'🎯'}</span>
    <div class="finish-name">SELAMAT, ${playerName.toUpperCase()}!</div>
    ${completed?'<div style="text-align:center;font-size:1rem;font-weight:800;color:#FFD700;margin-bottom:8px;">🎊 KAMU MENYELESAIKAN SEMUA LEVEL!</div>':''}
    <div class="finish-total">
      <div class="ft-lbl">TOTAL HADIAH</div>
      <div class="ft-val">Rp ${finalMoney.toLocaleString('id')}</div>
      <div class="ft-sub">${terbilang(finalMoney)} rupiah</div>
    </div>
    <div class="result-breakdown">
      <div class="rb-row"><span class="rb-ico">✅</span><span class="rb-label">Jawaban Benar</span><span class="rb-val green">${correctCount} / ${usedQuestions.length}</span></div>
      <div class="rb-row"><span class="rb-ico">📊</span><span class="rb-label">Level Tercapai</span><span class="rb-val">${currentLevel} / ${LEVELS.length}</span></div>
      <div class="rb-row"><span class="rb-ico">⭐</span><span class="rb-label">Predikat</span><span class="rb-val">${rankStr}</span></div>
    </div>
    <button class="btn btn-primary" onclick="showStart()">🔄 Main Lagi</button>
  `);

  speak(`Selamat ${playerName}! Kamu hebat! Total hadiah kamu adalah ${terbilang(finalMoney)} rupiah. ${rankStr}`,0.95);
}

// =============================================
// INIT
// =============================================
showStart();
window.addEventListener('touchstart',()=>{try{ac();}catch(e){}},{once:false,passive:true});
</script>
</body>
</html>
