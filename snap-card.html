<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SNAP! KARTU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#FFF9F0;font-family:'Fredoka One',cursive;touch-action:manipulation}
#root{display:flex;flex-direction:column;width:100vw;height:100dvh;max-height:100dvh}

/* ── HEADER ── */
#hdr{flex-shrink:0;background:linear-gradient(135deg,#FF6B9D,#FF9F43);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 3px 10px #FF6B9D44}
.hdr-name{font-size:clamp(11px,3vw,14px);color:#fff;opacity:0.9;font-family:'Nunito',sans-serif}
.hdr-score{font-size:clamp(22px,6vw,32px);color:#fff;text-shadow:2px 2px 0 #CC3366;line-height:1}
.hdr-title{font-size:clamp(18px,5vw,26px);color:#fff;text-shadow:2px 2px 0 #CC5500}
.hdr-center{display:flex;flex-direction:column;align-items:center}

/* ── FIELD ── */
#field{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-around;
  padding:8px;gap:6px;min-height:0;background:#FFF9F0;position:relative}

/* Player areas */
.player-area{width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-shrink:0}
.player-info{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
.player-label{font-size:12px;color:#888;font-family:'Nunito',sans-serif}
.player-name{font-size:clamp(13px,3.5vw,16px);color:#444}
.card-count{font-size:clamp(11px,3vw,13px);color:#aaa;font-family:'Nunito',sans-serif}
.deck-pile{position:relative;width:clamp(52px,14vw,72px);height:clamp(72px,19vw,100px);flex-shrink:0}
.deck-back{position:absolute;border-radius:10px;box-shadow:2px 2px 0 rgba(0,0,0,0.12);}

/* Center pile */
#center-area{display:flex;align-items:center;justify-content:center;gap:16px;flex-shrink:0}
.pile-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.pile-label{font-size:11px;color:#aaa;font-family:'Nunito',sans-serif;letter-spacing:1px}
.center-card{width:clamp(80px,22vw,110px);height:clamp(110px,30vw,150px);
  border-radius:14px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(44px,12vw,64px);border:3px solid #eee;
  transition:transform .15s;position:relative;flex-shrink:0}
.center-card.empty{background:#f5f0e8;border:3px dashed #ddd;font-size:clamp(20px,5vw,28px);color:#ccc}
.center-card.match-flash{animation:matchFlash .5s ease;}
@keyframes matchFlash{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
.card-animal{line-height:1}
.card-name{position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-size:clamp(9px,2.5vw,12px);color:#888;font-family:'Nunito',sans-serif}

/* SNAP button */
#snap-wrap{display:flex;justify-content:center;flex-shrink:0;padding:4px 0}
#snap-btn{width:clamp(130px,40vw,180px);height:clamp(60px,16vw,80px);
  border:none;border-radius:50px;cursor:pointer;
  background:linear-gradient(180deg,#FF6B9D,#CC3366);
  color:#fff;font-family:'Fredoka One',cursive;
  font-size:clamp(26px,7vw,36px);
  box-shadow:0 6px 0 #881133,0 8px 20px #FF6B9D66;
  transition:all .1s;user-select:none;letter-spacing:2px}
#snap-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #881133}
#snap-btn.disabled{background:linear-gradient(180deg,#ccc,#aaa);box-shadow:0 4px 0 #888;cursor:default}

/* AI SNAP button area */
#ai-snap-area{height:clamp(50px,13vw,70px);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#ai-btn{width:clamp(110px,35vw,150px);height:clamp(44px,12vw,58px);
  border:none;border-radius:50px;
  background:linear-gradient(180deg,#74B9FF,#0984e3);
  color:#fff;font-family:'Fredoka One',cursive;
  font-size:clamp(20px,5.5vw,28px);
  box-shadow:0 4px 0 #045ca0,0 6px 16px #74B9FF66;
  opacity:0;transition:all .1s;pointer-events:none;letter-spacing:1px}
#ai-btn.show{opacity:1}

/* Result popup */
#result-pop{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;
  background:rgba(0,0,0,0.5);backdrop-filter:blur(4px)}
#result-pop.gone{display:none}
.rpop-box{background:#fff;border-radius:28px;padding:28px 36px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:88vw;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.rpop-emoji{font-size:64px;line-height:1}
.rpop-title{font-size:clamp(24px,7vw,36px);color:#FF6B9D;text-shadow:2px 2px 0 #FFB3CC}
.rpop-sub{font-size:14px;color:#888;font-family:'Nunito',sans-serif;text-align:center}
.rpop-score{font-size:clamp(18px,5vw,26px);color:#FF9F43}
.rpop-btn{padding:14px 40px;border:none;border-radius:50px;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:18px;
  background:linear-gradient(180deg,#FF6B9D,#CC3366);
  color:#fff;box-shadow:0 4px 0 #881133;margin-top:4px}
.rpop-btn:active{transform:translateY(3px)}

/* Toast */
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);
  font-size:clamp(28px,8vw,42px);color:#fff;
  text-shadow:3px 3px 0 rgba(0,0,0,0.3);
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:90;
  white-space:nowrap;font-family:'Fredoka One',cursive}

/* Speed indicator */
#speed-bar{height:6px;background:#eee;border-radius:3px;width:80%;max-width:280px;margin:0 auto;flex-shrink:0}
#speed-fill{height:100%;background:linear-gradient(90deg,#00b894,#fdcb6e,#e17055);
  border-radius:3px;width:100%;transition:width .1s linear}

/* Level badge */
#level-badge{font-size:clamp(11px,3vw,14px);color:#fff;
  background:rgba(0,0,0,0.2);border-radius:20px;padding:2px 10px;
  font-family:'Nunito',sans-serif;font-weight:900;letter-spacing:1px;margin-top:2px}

/* Level up overlay */
#levelup-pop{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;
  pointer-events:none;opacity:0;transition:opacity .3s}
#levelup-pop.show{opacity:1;pointer-events:none}
.lvlup-box{background:linear-gradient(135deg,#FF9F43,#FF6B9D);
  border-radius:28px;padding:24px 44px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  transform:scale(0.7);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#levelup-pop.show .lvlup-box{transform:scale(1)}
.lvlup-num{font-size:clamp(48px,14vw,72px);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,0.2);line-height:1}
.lvlup-label{font-size:clamp(16px,4vw,22px);color:#fff;opacity:0.9;font-family:'Nunito',sans-serif}
.lvlup-theme{font-size:clamp(20px,6vw,28px);color:#fff;font-weight:bold;margin:2px 0}
.lvlup-sub{font-size:clamp(11px,3vw,14px);color:rgba(255,255,255,0.85);font-family:'Nunito',sans-serif;margin-top:4px}

/* Level progress dots */
#level-progress{display:flex;gap:6px;justify-content:center;align-items:center;flex-shrink:0;padding:2px 0}
.lvl-dot{width:10px;height:10px;border-radius:50%;background:#e0d8cc;transition:all .3s}
.lvl-dot.done{background:#FF6B9D;box-shadow:0 0 6px #FF6B9D}
.lvl-dot.current{background:#FF9F43;transform:scale(1.3);box-shadow:0 0 8px #FF9F43}

    {flipDelay:550, aiBaseSpeed:950,  aiJitter:350, label:'Wah kenceng! 🔥'},
    {flipDelay:480, aiBaseSpeed:800,  aiJitter:300, label:'Super cepat! 🚀'},
    {flipDelay:420, aiBaseSpeed:680,  aiJitter:250, label:'Gila cepetnya! 😱'},
    {flipDelay:360, aiBaseSpeed:560,  aiJitter:200, label:'Hampir gak bisa! 😰'},
    {flipDelay:300, aiBaseSpeed:450,  aiJitter:150, label:'Mode Dewa 👑'},
    {flipDelay:240, aiBaseSpeed:350,  aiJitter:100, label:'IMPOSIBEL!! 💀'},
  ];
  return configs[Math.min(lvl-1, configs.length-1)];
}

// ══════════════════════════════
//  DECK
// ══════════════════════════════
function buildDeck(){
  const theme=getCurrentTheme();
  let deck=[];
  theme.items.forEach(a=>{
    for(let i=0;i<4;i++) deck.push({...a});
  });
  return shuffle(deck);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ══════════════════════════════
//  START GAME
// ══════════════════════════════
function startGame(mode){
  gameMode = mode || gameMode;
  clearTimers();
  const deck=buildDeck();
  const half=Math.floor(deck.length/2);
  playerDeck=deck.slice(0,half);
  aiDeck=deck.slice(half);
  pileLeft=[]; pileRight=[];
  playerScore=0; aiScore=0; roundScore=0; cardFlipCount=0;
  currentLevel=1; snapsThisLevel=0;
  applyLevelSpeed();
  applyTheme();
  gamePhase='playing';
  activePlayer=Math.random()<0.5?'player':'ai';
  document.getElementById('result-pop').classList.add('gone');
  document.getElementById('snap-btn').classList.remove('disabled');

  // Setup UI for mode
  if(gameMode==='2p'){
    document.getElementById('ai-btn').style.display='none';
    document.getElementById('p2-snap-btn').style.display='';
    document.getElementById('hdr-p2-label').textContent='👆 PEMAIN 2';
    document.getElementById('hdr-p1-label').textContent='👇 PEMAIN 1';
    document.getElementById('level-badge').style.display=''; // tampilkan level di 2P juga
  } else {
    document.getElementById('ai-btn').style.display='';
    document.getElementById('p2-snap-btn').style.display='none';
    document.getElementById('hdr-p2-label').textContent='🤖 KOMPUTER';
    document.getElementById('hdr-p1-label').textContent='😊 KAMU';
    document.getElementById('level-badge').style.display='';
  }

  updateUI();
  renderPiles();
  renderLevelProgress();

  if(gameMode==='2p'){
    toast('👆 P2 di atas   👇 P1 di bawah', '#FF9F43');
    // Auto-flip for 2P (no AI, just timer-driven flips)
    activePlayer='player';
  } else {
    toast(activePlayer==='player'?'😊 Kamu duluan!':'🤖 Komputer duluan!', '#FF9F43');
  }
  scheduleFlip();
}

function clearTimers(){
  clearTimeout(flipTimer);
  clearTimeout(aiThinkTimer);
  clearInterval(speedInterval);
}

// ══════════════════════════════
//  FLIP CARD
// ══════════════════════════════
function scheduleFlip(){
  if(gamePhase!=='playing') return;
  const cfg=getLevelConfig(currentLevel);
  const delay=activePlayer==='player'?cfg.flipDelay:Math.floor(cfg.flipDelay*0.8);
  flipTimer=setTimeout(()=>flipCard(),delay);
  // Speed bar animation
  speedVal=100;
  document.getElementById('speed-fill').style.width='100%';
  clearInterval(speedInterval);
  speedInterval=setInterval(()=>{
    speedVal=Math.max(0,speedVal-2);
    document.getElementById('speed-fill').style.width=speedVal+'%';
  },delay/50);
}

function flipCard(){
  if(gamePhase!=='playing') return;
  clearInterval(speedInterval);

  let card=null;
  if(gameMode==='2p'){
    // In 2P: alternate flipping from each player's deck
    if(activePlayer==='player'){
      if(playerDeck.length===0){ checkGameOver(); return; }
      card=playerDeck.shift();
    } else {
      if(aiDeck.length===0){ checkGameOver(); return; }
      card=aiDeck.shift();
    }
  } else {
    if(activePlayer==='player'){
      if(playerDeck.length===0){ checkGameOver(); return; }
      card=playerDeck.shift();
    } else {
      if(aiDeck.length===0){ checkGameOver(); return; }
      card=aiDeck.shift();
    }
  }

  // Alternate piles
  cardFlipCount++;
  const useLeft=cardFlipCount%2===1;
  if(useLeft){ pileLeft.push(card); }
  else{ pileRight.push(card); }

  renderPiles();
  playFlip();
  updateUI();

  // Check SNAP condition
  const snapPossible=checkSnapCondition();
  if(snapPossible){
    gamePhase='snapping';
    if(gameMode==='1p'){
      scheduleAiSnap();
    } else {
      // In 2P: auto-resume after 3 seconds if nobody snaps (missed opportunity)
      aiThinkTimer=setTimeout(()=>{
        if(gamePhase!=='snapping') return;
        toast('⏰ Kelewatan!','#fdcb6e');
        gamePhase='playing';
        activePlayer=activePlayer==='player'?'ai':'player';
        scheduleFlip();
      },3000);
    }
  } else {
    activePlayer=activePlayer==='player'?'ai':'player';
    scheduleFlip();
  }
}

// ══════════════════════════════
//  SNAP CONDITION
// ══════════════════════════════
function checkSnapCondition(){
  const topL=pileLeft.length>0?pileLeft[pileLeft.length-1]:null;
  const topR=pileRight.length>0?pileRight[pileRight.length-1]:null;
  if(!topL||!topR) return false;
  return topL.emoji===topR.emoji;
}

// ══════════════════════════════
//  PLAYER SNAPS
// ══════════════════════════════
document.getElementById('snap-btn').addEventListener('click', onPlayerSnap);
document.getElementById('snap-btn').addEventListener('touchstart', e=>{e.preventDefault();onPlayerSnap();},{passive:false});
document.getElementById('p2-snap-btn').addEventListener('click', onP2Snap);
document.getElementById('p2-snap-btn').addEventListener('touchstart', e=>{e.preventDefault();onP2Snap();},{passive:false});

function onPlayerSnap(){
  if(gamePhase==='idle'||gamePhase==='roundover') return;
  const isMatch=checkSnapCondition();
  if(isMatch&&(gamePhase==='playing'||gamePhase==='snapping')){
    clearTimeout(aiThinkTimer);
    gamePhase='roundover';
    clearTimers();
    const won=[...pileLeft,...pileRight];
    playerDeck.push(...shuffle(won));
    playerScore+=1; // 1 poin per SNAP
    roundScore++;
    snapsThisLevel++;
    pileLeft=[]; pileRight=[];
    cardFlipCount=0;
    renderPiles();
    updateUI();
    if(gameMode==='2p'){
      snapEffect('player2p1', won.length);
    } else {
      snapEffect('player', won.length);
    }
    if(snapsThisLevel>=SNAPS_TO_LEVELUP && currentLevel<MAX_LEVEL){
      setTimeout(()=>{ if(checkGameOver()) return; doLevelUp(); },900);
    } else {
      setTimeout(()=>{
        if(checkGameOver()) return;
        gamePhase='playing';
        activePlayer='player';
        scheduleFlip();
      },1400);
    }
  } else {
    penalty('player');
  }
}

function onP2Snap(){
  if(gamePhase==='idle'||gamePhase==='roundover'||gameMode!=='2p') return;
  const isMatch=checkSnapCondition();
  if(isMatch&&(gamePhase==='playing'||gamePhase==='snapping')){
    clearTimeout(aiThinkTimer);
    gamePhase='roundover';
    clearTimers();
    const won=[...pileLeft,...pileRight];
    aiDeck.push(...shuffle(won));
    aiScore+=1; // 1 poin per SNAP
    snapsThisLevel++;
    pileLeft=[]; pileRight=[];
    cardFlipCount=0;
    renderPiles();
    updateUI();
    snapEffect('player2p2', won.length);
    if(snapsThisLevel>=SNAPS_TO_LEVELUP && currentLevel<MAX_LEVEL){
      setTimeout(()=>{ if(checkGameOver()) return; doLevelUp(); },900);
    } else {
      setTimeout(()=>{
        if(checkGameOver()) return;
        gamePhase='playing';
        activePlayer='ai';
        scheduleFlip();
      },1400);
    }
  } else {
    penalty('ai');
  }
}

// ══════════════════════════════
//  AI SNAPS
// ══════════════════════════════
function scheduleAiSnap(){
  // AI reacts based on current level difficulty
  const cfg=getLevelConfig(currentLevel);
  const reaction=Math.max(250, cfg.aiBaseSpeed + Math.floor(Math.random()*cfg.aiJitter - cfg.aiJitter/2));
  aiThinkTimer=setTimeout(()=>{
    if(gamePhase!=='snapping') return;
    // Show AI snap button briefly
    const aiBtn=document.getElementById('ai-btn');
    aiBtn.classList.add('show');
    setTimeout(()=>aiBtn.classList.remove('show'),600);

    gamePhase='roundover';
    clearTimers();
    const won=[...pileLeft,...pileRight];
    aiDeck.push(...shuffle(won));
    aiScore+=1; // 1 poin per SNAP
    snapsThisLevel++; // AI snap juga hitung untuk naik level
    pileLeft=[]; pileRight=[];
    cardFlipCount=0;
    renderPiles();
    updateUI();
    snapEffect('ai', won.length);
    if(snapsThisLevel>=SNAPS_TO_LEVELUP && currentLevel<MAX_LEVEL){
      setTimeout(()=>{ if(checkGameOver()) return; doLevelUp(); },900);
    } else {
      setTimeout(()=>{
        if(checkGameOver()) return;
        gamePhase='playing';
        activePlayer='ai';
        scheduleFlip();
      },1400);
    }
  }, reaction);
}

// ══════════════════════════════
//  PENALTY
// ══════════════════════════════
function penalty(who){
  playWrong();
  toast('❌ Salah SNAP! -3 kartu', '#e17055');
  if(who==='player'){
    const give=playerDeck.splice(0,Math.min(3,playerDeck.length));
    aiDeck.push(...give);
  } else {
    const give=aiDeck.splice(0,Math.min(3,aiDeck.length));
    playerDeck.push(...give);
  }
  updateUI();
  renderPiles(); // update visual deck stack setelah kartu berpindah
}

//  SOUND
// ══════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudio(){
  if(!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playSnap(){
  try {
    const ctx = getAudio();
    // Suara "ting!" — high pitched ping
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.6, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
    // Tambah "cetas" — short noise burst
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(300, ctx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.05);
    gain2.gain.setValueAtTime(0.3, ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime + 0.06);
  } catch(e){}
}

function playWrong(){
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(e){}
}

function playFlip(){
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(500, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.05);
  } catch(e){}
}

// ══════════════════════════════
//  CHECK GAME OVER
// ══════════════════════════════
function checkGameOver(){
  const pDeckEmpty=playerDeck.length===0;
  const aDeckEmpty=aiDeck.length===0;
  if(!pDeckEmpty&&!aDeckEmpty) return false;
  // Kalau masih ada kartu di pile, belum game over — kartu akan kembali ke pemenang SNAP berikutnya
  if((pileLeft.length>0||pileRight.length>0)) return false;

  gamePhase='idle';
  clearTimers();

  const pop=document.getElementById('result-pop');
  pop.classList.remove('gone');
  document.getElementById('mode-btns').style.display='none';
  document.getElementById('gameover-btns').style.display='flex';
  const modeLabel = gameMode==='2p'?'👦👧 Main Lagi (2P)':'🤖 Main Lagi (vs AI)';
  document.getElementById('rp-btn-again').textContent='▶ '+modeLabel.slice(modeLabel.indexOf(' ')+1);

  const p2name=gameMode==='2p'?'PEMAIN 2':'KOMPUTER';
  const p1name=gameMode==='2p'?'PEMAIN 1':'KAMU';

  if(pDeckEmpty&&aDeckEmpty){
    document.getElementById('rp-emoji').textContent='🤝';
    document.getElementById('rp-title').textContent='SERI!';
    document.getElementById('rp-score').textContent=gameMode==='2p'?`P1: ${playerScore} poin | P2: ${aiScore} poin`:`Level: ${currentLevel}`;
    document.getElementById('rp-sub').textContent='Sama-sama habis kartu!';
  } else if(aDeckEmpty){
    document.getElementById('rp-emoji').textContent='🏆';
    document.getElementById('rp-title').textContent=`${p1name} MENANG!`;
    document.getElementById('rp-score').textContent=gameMode==='2p'?`P1: ${playerScore} poin | P2: ${aiScore} poin`:`${playerScore} poin | Level: ${currentLevel}`;
    document.getElementById('rp-sub').textContent=gameMode==='2p'?'Pemain 1 lebih cepat! 🎉':'Hebat! Kartu komputer habis duluan! 🎉';
  } else {
    document.getElementById('rp-emoji').textContent='🏆';
    document.getElementById('rp-title').textContent=`${p2name} MENANG!`;
    document.getElementById('rp-score').textContent=gameMode==='2p'?`P1: ${playerScore} poin | P2: ${aiScore} poin`:`${playerScore} poin | Level: ${currentLevel}`;
    document.getElementById('rp-sub').textContent=gameMode==='2p'?'Pemain 2 lebih cepat! 🎉':'Coba lagi, kamu pasti bisa! 💪';
  }
  return true;
}

// ══════════════════════════════
function applyLevelSpeed(){
  const cfg=getLevelConfig(currentLevel);
  aiSpeed=cfg.aiBaseSpeed; // kept for reference
}

function applyTheme(){
  const t=getCurrentTheme();
  // Background
  document.body.style.background=t.bg;
  document.getElementById('field').style.background=t.bg;
  // Header gradient
  document.getElementById('hdr').style.background=`linear-gradient(135deg,${t.headerGrad})`;
  document.getElementById('hdr').style.boxShadow=`0 3px 10px ${t.headerShadow}`;
  // Title
  document.getElementById('hdr-title-text').textContent=t.name;
  // Dark bg — make card text visible
  const isDark=['#0a0a1a','#1a0a2e','#0d1117','#001a33','#1a0a00'].includes(t.bg);
  document.querySelectorAll('.pile-label,.card-name,.player-label,.card-count').forEach(el=>{
    el.style.color=isDark?'rgba(255,255,255,0.5)':'';
  });
  document.querySelectorAll('.center-card.empty').forEach(el=>{
    el.style.background=isDark?'#ffffff11':'';
    el.style.borderColor=isDark?'#ffffff22':'';
  });
}

function doLevelUp(){
  currentLevel++;
  snapsThisLevel=0;
  applyLevelSpeed();
  applyTheme();
  renderLevelProgress();
  updateLevelBadge();

  // Reset deck penuh dengan tema baru — kartu dibagi rata lagi
  const newDeck=buildDeck();
  const half=Math.floor(newDeck.length/2);
  playerDeck=newDeck.slice(0,half);
  aiDeck=newDeck.slice(half);
  pileLeft=[]; pileRight=[];
  cardFlipCount=0;
  updateUI();
  renderPiles();

  // Show level up popup
  const pop=document.getElementById('levelup-pop');
  document.getElementById('lvlup-num').textContent=currentLevel;
  const theme=getCurrentTheme();
  document.getElementById('lvlup-theme').textContent=theme.name;
  const cfg=getLevelConfig(currentLevel);
  document.getElementById('lvlup-sub').textContent=cfg.label;
  pop.classList.add('show');
  setTimeout(()=>{
    pop.classList.remove('show');
    setTimeout(()=>{
      if(checkGameOver()) return;
      gamePhase='playing';
      activePlayer='player';
      scheduleFlip();
    },350);
  },1800);
}

function updateLevelBadge(){
  document.getElementById('level-num').textContent=currentLevel;
}

function renderLevelProgress(){
  const wrap=document.getElementById('level-progress');
  wrap.innerHTML='';
  for(let i=1;i<=MAX_LEVEL;i++){
    const dot=document.createElement('div');
    dot.className='lvl-dot';
    if(i<currentLevel){ dot.classList.add('done'); }
    else if(i===currentLevel){ dot.classList.add('current'); }
    wrap.appendChild(dot);
  }
}

//  RENDER
// ══════════════════════════════
const CARD_COLORS=['#FFD93D','#FF6B9D','#74B9FF','#A29BFE','#55EFC4','#FDCB6E','#FD79A8','#6C5CE7'];

function renderPiles(){
  renderCenterCard('pile-left', pileLeft);
  renderCenterCard('pile-right', pileRight);
  renderDeckPile('ai-pile', aiDeck.length, true);
  renderDeckPile('pl-pile', playerDeck.length, false);
}

function renderCenterCard(id, pile){
  const el=document.getElementById(id);
  if(pile.length===0){
    el.innerHTML='🃏';
    el.className='center-card empty';
    return;
  }
  const card=pile[pile.length-1];
  const theme=getCurrentTheme();
  const idx=theme.items.findIndex(a=>a.emoji===card.emoji);
  const col=CARD_COLORS[idx%CARD_COLORS.length];
  el.className='center-card';
  el.style.borderColor=col;
  el.style.background=`linear-gradient(145deg,#fff,${col}22)`;
  el.innerHTML=`<div class="card-animal">${card.emoji}</div><div class="card-name">${card.name}</div>`;

  // Stack indicator
  if(pile.length>1){
    const stackEl=document.createElement('div');
    stackEl.style.cssText=`position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;
      border-radius:14px;background:#fff;border:3px solid ${col}66;z-index:-1`;
    el.appendChild(stackEl);
  }
}

function renderDeckPile(id, count, isAi){
  const el=document.getElementById(id);
  el.innerHTML='';
  if(count===0){
    el.innerHTML=`<div style="width:100%;height:100%;border-radius:10px;background:#f0ece4;border:2px dashed #ddd;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc">✕</div>`;
    return;
  }
  // Draw stacked cards
  const show=Math.min(count,4);
  for(let i=0;i<show;i++){
    const card=document.createElement('div');
    const offset=i*2;
    card.className='deck-back';
    card.style.cssText=`
      width:100%;height:100%;
      background:${isAi?'linear-gradient(135deg,#74B9FF,#0984e3)':'linear-gradient(135deg,#FF6B9D,#CC3366)'};
      top:${-offset}px;left:${offset}px;
      border:2px solid rgba(255,255,255,0.4);
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(22px,6vw,30px);
    `;
    card.textContent=isAi?'🤖':'😊';
    el.appendChild(card);
  }
  // Count badge
  const badge=document.createElement('div');
  badge.style.cssText=`position:absolute;bottom:-8px;${isAi?'left':'right'}:-8px;
    background:${isAi?'#0984e3':'#CC3366'};color:#fff;border-radius:50%;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-family:'Nunito',sans-serif;font-weight:900;border:2px solid #fff;z-index:10`;
  badge.textContent=count;
  el.appendChild(badge);
}

function updateUI(){
  document.getElementById('ai-score').textContent=aiScore;
  document.getElementById('pl-score').textContent=playerScore;
  document.getElementById('ai-count').textContent=aiDeck.length;
  document.getElementById('pl-count').textContent=playerDeck.length;
  updateLevelBadge();
}

// ══════════════════════════════
//  TOAST
// ══════════════════════════════
function toast(msg, col){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.style.color=col||'#fff';
  el.style.opacity='1';
  clearTimeout(toastTO);
  toastTO=setTimeout(()=>el.style.opacity='0',1400);
}

// ══════════════════════════════
//  INIT — show start screen
// ══════════════════════════════
// Render empty state
renderPiles();
updateUI();
renderLevelProgress();
applyTheme();

// Show main menu
showMenu();
document.getElementById('rp-sub').textContent='10 Level, 10 Tema! Pilih mode:';

</script>
</body>
</html>
