<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏎️ Turbo Dash!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  background: #0a0a1a;
  font-family: 'Fredoka One', cursive;
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#gameCanvas {
  display: block;
  image-rendering: pixelated;
}

/* Screens */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 50;
  transition: opacity 0.4s;
  padding: 20px;
}
.screen.hidden { opacity:0; pointer-events:none; }

/* MENU */
#menuScreen {
  background: radial-gradient(ellipse at 50% 30%, #1a0a40 0%, #0a0a1a 70%);
}
.title-emoji { font-size: clamp(3rem,10vw,5rem); animation: floatY 2s ease-in-out infinite; filter: drop-shadow(0 0 20px #FF6600); }
@keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

.game-title {
  font-size: clamp(2.8rem, 10vw, 5.5rem);
  background: linear-gradient(135deg, #FF6B00, #FFD700, #FF6B00);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShine 2s linear infinite;
  text-align: center;
  line-height: 1;
  filter: drop-shadow(0 4px 12px #FF6B0088);
}
@keyframes titleShine { 0%{background-position:0%} 100%{background-position:200%} }

.tagline { color: #88aaff; font-family:'Nunito',sans-serif; font-size:1rem; margin:8px 0 24px; letter-spacing:2px; font-weight:700; }

.car-row { display:flex; gap:20px; margin:12px 0 28px; font-size:2.2rem; animation: slideIn 0.6s ease; }
@keyframes slideIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.car-option {
  cursor: pointer;
  padding: 10px 18px;
  border-radius: 16px;
  background: rgba(255,255,255,0.07);
  border: 3px solid rgba(255,255,255,0.15);
  transition: all 0.2s;
  font-size: 2rem;
  filter: grayscale(0.3);
}
.car-option.selected, .car-option:hover {
  border-color: #FFD700;
  background: rgba(255,215,0,0.15);
  transform: scale(1.12);
  filter: none;
  box-shadow: 0 0 20px #FFD70066;
}
.car-label { font-size:0.7rem; color:#aaa; display:block; text-align:center; margin-top:3px; font-family:'Nunito',sans-serif; }

.btn-play {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.3rem,4vw,1.8rem);
  background: linear-gradient(135deg, #FF6B00, #FF3300);
  color: white;
  border: none; border-radius: 50px;
  padding: 14px 50px;
  cursor: pointer;
  box-shadow: 0 6px 0 #991100, 0 12px 30px #FF330044;
  transition: all 0.15s;
  letter-spacing: 1px;
}
.btn-play:hover { transform:translateY(-3px); box-shadow:0 9px 0 #991100, 0 18px 35px #FF330066; }
.btn-play:active { transform:translateY(3px); box-shadow:0 3px 0 #991100; }

.best-score { color:#FFD700aa; font-size:0.9rem; margin-top:14px; font-family:'Nunito',sans-serif; }
.best-score span { color:#FFD700; font-weight:900; }

/* HUD */
#hud {
  position: fixed; top:0; left:0; right:0;
  display: flex; justify-content:space-between; align-items:flex-start;
  padding: 10px 16px;
  z-index: 30;
  pointer-events: none;
}
.hud-box {
  background: rgba(0,0,0,0.6);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 6px 14px;
  backdrop-filter: blur(4px);
}
.hud-label { font-size:0.6rem; color:#88aaff; letter-spacing:2px; font-family:'Nunito',sans-serif; font-weight:700; display:block; }
.hud-value { font-size:1.3rem; color:white; line-height:1.1; }
.hud-stars { font-size:1.1rem; letter-spacing:2px; }
.hud-lives { font-size:1.1rem; letter-spacing:1px; }

/* GAME OVER */
#gameoverScreen {
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(10px);
}
.go-icon { font-size:4rem; animation:crashAnim 0.5s ease; }
@keyframes crashAnim { 0%{transform:scale(0) rotate(-30deg)} 60%{transform:scale(1.3) rotate(10deg)} 100%{transform:scale(1) rotate(0)} }
.go-title { font-size:clamp(2.5rem,8vw,4rem); color:#FF4444; text-shadow:0 0 20px #FF444488; margin:8px 0 4px; }
.go-score { font-size:clamp(1.2rem,4vw,1.8rem); color:white; margin-bottom:4px; font-family:'Nunito',sans-serif; }
.go-score span { color:#FFD700; font-size:2rem; font-weight:900; }
.new-rec { color:#FFD700; font-size:1rem; animation:pulse 1s infinite alternate; margin-bottom:8px; }
@keyframes pulse { from{opacity:0.6;transform:scale(1)} to{opacity:1;transform:scale(1.08)} }
.go-btns { display:flex; gap:12px; margin-top:16px; }
.btn-retry { font-family:'Fredoka One',cursive; font-size:1.1rem; border:none; border-radius:50px; padding:12px 32px; cursor:pointer; transition:all 0.15s; }
.btn-retry:hover { transform:translateY(-2px); }

/* Mobile controls */
#controls {
  position: fixed;
  bottom: 20px; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 0 20px;
  z-index: 30;
  pointer-events: none;
}
.ctrl-btn {
  width: 72px; height: 72px;
  background: rgba(255,255,255,0.12);
  border: 3px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  display: flex; align-items:center; justify-content:center;
  font-size: 1.8rem;
  cursor: pointer;
  pointer-events: all;
  user-select: none;
  -webkit-user-select: none;
  transition: all 0.1s;
  backdrop-filter: blur(4px);
}
.ctrl-btn:active { background:rgba(255,255,255,0.3); transform:scale(0.92); }

/* Speed lines canvas overlay */
#speedCanvas { position:fixed; inset:0; pointer-events:none; z-index:5; }
</style>
</head>
<body>
<canvas id="speedCanvas"></canvas>
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-box">
    <span class="hud-label">SKOR</span>
    <span class="hud-value" id="hudScore">0</span>
  </div>
  <div class="hud-box">
    <span class="hud-label">BINTANG ⭐</span>
    <span class="hud-value hud-stars" id="hudStars">0</span>
  </div>
  <div class="hud-box">
    <span class="hud-label">NYAWA</span>
    <span class="hud-value hud-lives" id="hudLives">❤️❤️❤️</span>
  </div>
</div>

<!-- MENU -->
<div class="screen" id="menuScreen">
  <div class="title-emoji">🏎️</div>
  <div class="game-title">TURBO DASH!</div>
  <div class="tagline">⚡ DODGE · COLLECT · SURVIVE ⚡</div>
  <div style="color:#aaa;font-family:'Nunito',sans-serif;font-size:0.85rem;margin-bottom:8px">PILIH MOBILMU</div>
  <div class="car-row" id="carRow">
    <div class="car-option selected" data-car="0" onclick="selectCar(0)">🏎️<span class="car-label">Merah</span></div>
    <div class="car-option" data-car="1" onclick="selectCar(1)">🚗<span class="car-label">Biru</span></div>
    <div class="car-option" data-car="2" onclick="selectCar(2)">🚕<span class="car-label">Kuning</span></div>
    <div class="car-option" data-car="3" onclick="selectCar(3)">🚙<span class="car-label">Hijau</span></div>
  </div>
  <button class="btn-play" onclick="startGame()">🚀 MULAI BALAPAN!</button>
  <div class="best-score">Rekor Tertinggi: <span id="bestScoreMenu">0</span></div>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="gameoverScreen">
  <div class="go-icon">💥</div>
  <div class="go-title">NABRAK!</div>
  <div class="go-score">Skor: <span id="goScore">0</span></div>
  <div class="go-score" style="font-size:1rem">Bintang: <span id="goStars" style="font-size:1.3rem">0</span> ⭐</div>
  <div class="new-rec hidden" id="newRec">🏆 REKOR BARU!</div>
  <div class="go-btns">
    <button class="btn-retry" style="background:linear-gradient(135deg,#FF6B00,#FF3300);color:white;box-shadow:0 4px 0 #991100" onclick="startGame()">🔄 Main Lagi</button>
    <button class="btn-retry" style="background:rgba(255,255,255,0.1);color:white;border:2px solid rgba(255,255,255,0.2)" onclick="showMenu()">🏠 Menu</button>
  </div>
</div>

<!-- Mobile Controls -->
<div id="controls" class="hidden">
  <div class="ctrl-btn" id="btnLeft" ontouchstart="keyState.left=true" ontouchend="keyState.left=false">⬅️</div>
  <div class="ctrl-btn" id="btnRight" ontouchstart="keyState.right=true" ontouchend="keyState.right=false">➡️</div>
</div>

<script>
// ===== CANVAS =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speedCv = document.getElementById('speedCanvas');
const sctx = speedCv.getContext('2d');
let W, H;

function resize() {
  const maxW = Math.min(window.innerWidth, 480);
  W = canvas.width  = speedCv.width  = maxW;
  H = canvas.height = speedCv.height = window.innerHeight;
}
resize();
window.addEventListener('resize', ()=>{ resize(); buildRoad(); });

// ===== CARS =====
const CAR_EMOJIS = ['🏎️','🚗','🚕','🚙'];
const OBSTACLE_CARS = ['🚌','🚛','🚜','🚐','🏍️','🚑'];
const BONUS_ITEMS = ['⭐','💎','🌟','🎁','💰'];

let selectedCar = 0;
function selectCar(i) {
  selectedCar = i;
  document.querySelectorAll('.car-option').forEach((el,j)=>{
    el.classList.toggle('selected', j===i);
  });
}

// ===== STATE =====
let score=0, stars=0, lives=3, speed=3, frameCount=0, gameRunning=false;
let bestScore = 0;
let animId = null;
let shakeTimer = 0;
let flashTimer = 0;
let levelUp = 0;

const keyState = { left:false, right:false };

// ===== ROAD =====
const LANES = 3;
let laneW, laneX = [];
let roadLeft, roadRight;
let stripeY = 0;

function buildRoad() {
  const roadW = W * 0.78;
  roadLeft  = (W - roadW) / 2;
  roadRight = roadLeft + roadW;
  laneW = roadW / LANES;
  laneX = [];
  for(let i=0;i<LANES;i++) laneX.push(roadLeft + laneW*i + laneW/2);
}
buildRoad();

// ===== PLAYER =====
let player = { lane:1, x:0, y:0, w:42, h:64, targetX:0, invincible:0 };

function initPlayer() {
  player.lane = 1;
  player.x = laneX[1];
  player.y = H - 120;
  player.targetX = laneX[1];
  player.invincible = 0;
}

// ===== OBSTACLES & ITEMS =====
let obstacles = [];
let bonusItems = [];
let particles = [];
let bgCars = []; // decorative background traffic

// ===== BACKGROUND =====
let bgStars = [];
function initBgStars() {
  bgStars = [];
  for(let i=0;i<40;i++) bgStars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.5+0.5, sp:Math.random()*0.5+0.2});
}
initBgStars();

// ===== SCREENS =====
function showMenu() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  document.getElementById('menuScreen').classList.remove('hidden');
  document.getElementById('gameoverScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('bestScoreMenu').textContent = bestScore;
  ctx.clearRect(0,0,W,H);
}

function startGame() {
  score=0; stars=0; lives=3; speed=3; frameCount=0;
  obstacles=[]; bonusItems=[]; particles=[]; bgCars=[];
  shakeTimer=0; flashTimer=0; levelUp=0;
  initPlayer();
  buildRoad();
  initBgStars();
  spawnBgCar(); spawnBgCar();

  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameoverScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  updateHUD();
  gameRunning = true;
  lastTime = 0;
  animId = requestAnimationFrame(loop);
}

function gameOver() {
  gameRunning = false;
  cancelAnimationFrame(animId);
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('goScore').textContent = score;
  document.getElementById('goStars').textContent = stars;
  const nr = document.getElementById('newRec');
  if(score > bestScore) {
    bestScore = score;
    nr.classList.remove('hidden');
  } else {
    nr.classList.add('hidden');
  }
  // Render ledakan akhir — jalankan loop explosion singkat
  for(let i=0;i<20;i++) spawnParticle(player.x, player.y, ['💥','🔥','✨','⚡'][Math.floor(Math.random()*4)]);
  let explFrames=0;
  function explLoop(){
    if(explFrames++>35){ 
      document.getElementById('gameoverScreen').classList.remove('hidden');
      return;
    }
    ctx.save();
    ctx.translate(0,0);
    drawRoad();
    drawParticles();
    ctx.restore();
    requestAnimationFrame(explLoop);
  }
  explLoop();
}

function updateHUD() {
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudStars').textContent = stars;
  const h = ['❤️','❤️','❤️'].slice(0,lives).join('') || '💔';
  document.getElementById('hudLives').textContent = h;
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keyState.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keyState.right=true;
});
document.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keyState.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keyState.right=false;
});

// Swipe
let touchStartX = 0;
canvas.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
canvas.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx)>30) { if(dx<0) moveLeft(); else moveRight(); }
}, {passive:true});

let lastLeft=false, lastRight=false;
function moveLeft()  { if(player.lane>0) { player.lane--; player.targetX=laneX[player.lane]; } }
function moveRight() { if(player.lane<LANES-1) { player.lane++; player.targetX=laneX[player.lane]; } }

// ===== SPAWN =====
function spawnObstacle() {
  const lane = Math.floor(Math.random()*LANES);
  obstacles.push({
    emoji: OBSTACLE_CARS[Math.floor(Math.random()*OBSTACLE_CARS.length)],
    lane, x: laneX[lane], y: -80, w:44, h:64,
    speed: speed * (0.8+Math.random()*0.5)
  });
}

function spawnBonus() {
  const lane = Math.floor(Math.random()*LANES);
  bonusItems.push({
    emoji: BONUS_ITEMS[Math.floor(Math.random()*BONUS_ITEMS.length)],
    lane, x: laneX[lane], y: -50,
    speed: speed*0.7, angle:0, scale:1
  });
}

function spawnBgCar() {
  bgCars.push({
    x: roadLeft + Math.random()*(roadRight-roadLeft),
    y: -60, speed: 1+Math.random()*1.5,
    color: `hsl(${Math.random()*360},50%,40%)`,
    w: 22, h: 36, alpha: 0.4
  });
}

function spawnParticle(x,y,emoji) {
  particles.push({
    x, y, emoji,
    vx:(Math.random()-0.5)*6,
    vy:-(2+Math.random()*4),
    alpha:1, scale:1+Math.random()
  });
}

// ===== DRAW =====
function drawRoad() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0,0,0,H*0.35);
  sky.addColorStop(0, '#0a0a2a');
  sky.addColorStop(1, '#1a1240');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // Bg stars
  bgStars.forEach(s=>{
    s.y += s.sp;
    if(s.y>H) { s.y=-5; s.x=Math.random()*W; }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
  });

  // Grass
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, H*0.3, roadLeft, H);
  ctx.fillRect(roadRight, H*0.3, W-roadRight, H);

  // Grass texture stripes
  ctx.fillStyle = '#1e5520';
  for(let y=0; y<H; y+=30) {
    ctx.fillRect(0, y, roadLeft, 14);
    ctx.fillRect(roadRight, y, W-roadRight, 14);
  }

  // Road body
  const roadGrad = ctx.createLinearGradient(roadLeft,0,roadRight,0);
  roadGrad.addColorStop(0, '#2a2a35');
  roadGrad.addColorStop(0.5, '#323240');
  roadGrad.addColorStop(1, '#2a2a35');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(roadLeft, 0, roadRight-roadLeft, H);

  // Road edges (white lines)
  ctx.strokeStyle = '#ffffff88';
  ctx.lineWidth = 5;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(roadLeft,0); ctx.lineTo(roadLeft,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(roadRight,0); ctx.lineTo(roadRight,H); ctx.stroke();

  // Lane dividers (dashed)
  stripeY = (stripeY + speed) % 60;
  ctx.strokeStyle = '#ffffff44';
  ctx.lineWidth = 3;
  ctx.setLineDash([30, 30]);
  ctx.lineDashOffset = -stripeY;
  for(let i=1;i<LANES;i++) {
    const x = roadLeft + laneW*i;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawBgCars(dt) {
  bgCars.forEach(c=>{
    c.y += c.speed * dt;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.roundRect(c.x-c.w/2, c.y-c.h/2, c.w, c.h, 5);
    ctx.fill();
    // headlights
    ctx.fillStyle = '#ffff8888';
    ctx.fillRect(c.x-c.w/2+3, c.y+c.h/2-8, 6, 5);
    ctx.fillRect(c.x+c.w/2-9, c.y+c.h/2-8, 6, 5);
    ctx.restore();
  });
  bgCars = bgCars.filter(c=>c.y<H+80);
}

function drawEmoji(emoji, x, y, size, angle=0, alpha=1, scale=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.font = `${size}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 0, 0);
  ctx.restore();
}

function drawPlayer() {
  const flicker = player.invincible > 0 && Math.floor(frameCount/4)%2===0;
  if(flicker) return;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(player.x, player.y+player.h*0.45, player.w*0.45, 10, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Speed glow trail
  if(speed > 5) {
    for(let i=1;i<=3;i++) {
      ctx.save();
      ctx.globalAlpha = 0.15/i;
      ctx.font = `52px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(CAR_EMOJIS[selectedCar], player.x, player.y + i*20);
      ctx.restore();
    }
  }

  drawEmoji(CAR_EMOJIS[selectedCar], player.x, player.y, 52);

  // Exhaust particles
  if(frameCount%4===0 && gameRunning) {
    particles.push({
      x: player.x + (Math.random()-0.5)*10,
      y: player.y + 32,
      emoji: '💨',
      vx:(Math.random()-0.5)*1,
      vy:1+Math.random()*2,
      alpha:0.6, scale:0.7
    });
  }
}

function drawObstacles(dt) {
  obstacles.forEach(o=>{
    o.y += o.speed * dt;
    // Shadow
    ctx.save(); ctx.globalAlpha=0.2;
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.ellipse(o.x, o.y+o.h*0.4, o.w*0.4, 8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    drawEmoji(o.emoji, o.x, o.y, 50);
  });
}

function drawBonusItems(dt) {
  bonusItems.forEach(b=>{
    b.y += b.speed * dt;
    b.angle += 0.05;
    b.scale = 1 + Math.sin(frameCount*0.1)*0.1;
    ctx.save();
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 15;
    drawEmoji(b.emoji, b.x, b.y, 36, b.angle, 1, b.scale);
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= 0.025;
    p.scale *= 0.97;
    drawEmoji(p.emoji, p.x, p.y, 28, 0, Math.max(0,p.alpha), p.scale);
  });
  particles = particles.filter(p=>p.alpha>0);
}

function drawSpeedLines() {
  sctx.clearRect(0,0,W,H);
  if(speed < 5) return;
  const intensity = Math.min((speed-5)/5, 1);
  sctx.save();
  sctx.globalAlpha = intensity*0.25;
  for(let i=0;i<12;i++) {
    const x = roadLeft + Math.random()*(roadRight-roadLeft);
    const len = 40+Math.random()*60;
    const y = Math.random()*H;
    sctx.strokeStyle = 'rgba(255,255,200,0.8)';
    sctx.lineWidth = 1;
    sctx.beginPath();
    sctx.moveTo(x, y);
    sctx.lineTo(x, y+len);
    sctx.stroke();
  }
  sctx.restore();
}

// Level up banner
function drawLevelUp() {
  if(levelUp<=0) return;
  levelUp--;
  ctx.save();
  ctx.globalAlpha = Math.min(levelUp/20, 1);
  ctx.font = `bold ${clamp(24,5,50)}px Fredoka One`;
  ctx.fillStyle = '#FFD700';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 20;
  ctx.fillText(`⚡ MAKIN CEPAT! ⚡`, W/2, H/2 - 60);
  ctx.restore();
}
function clamp(v,mn,mx){ return Math.max(mn,Math.min(mx,v)); }

// ===== COLLISION =====
function checkCollisions() {
  // Obstacles
  for(let i=obstacles.length-1;i>=0;i--) {
    const o = obstacles[i];
    if(Math.abs(o.x-player.x)<32 && Math.abs(o.y-player.y)<44) {
      if(player.invincible>0) {
        obstacles.splice(i,1);
        score+=5;
        spawnParticle(o.x,o.y,'💥');
        continue;
      }
      obstacles.splice(i,1);
      lives--;
      player.invincible = 120;
      shakeTimer = 20;
      flashTimer = 15;
      for(let j=0;j<8;j++) spawnParticle(player.x, player.y, ['💥','🔥','⚡'][Math.floor(Math.random()*3)]);
      updateHUD();
      if(lives<=0) { setTimeout(gameOver,400); gameRunning=false; }
    }
  }

  // Bonus
  for(let i=bonusItems.length-1;i>=0;i--) {
    const b = bonusItems[i];
    if(Math.abs(b.x-player.x)<30 && Math.abs(b.y-player.y)<30) {
      bonusItems.splice(i,1);
      if(b.emoji==='⭐'||b.emoji==='🌟') { stars++; score+=50; spawnParticle(b.x,b.y,'⭐'); }
      else if(b.emoji==='💎') { score+=100; spawnParticle(b.x,b.y,'💎'); }
      else { score+=30; spawnParticle(b.x,b.y,'✨'); }
      updateHUD();
    }
  }
}

// ===== MAIN LOOP =====
let lastTime = 0;
function loop(ts) {
  if(!gameRunning) return;
  if(lastTime===0) lastTime=ts;
  const dt = Math.min((ts-lastTime)/16, 3);
  lastTime = ts;
  frameCount++;

  // Speed increase
  const newSpeed = 3 + Math.floor(score/300)*0.5;
  if(newSpeed > speed && speed < 12) { speed = newSpeed; levelUp = 80; }

  // Player movement
  if(keyState.left  && !lastLeft)  { moveLeft();  lastLeft=true;  }
  if(keyState.right && !lastRight) { moveRight(); lastRight=true; }
  if(!keyState.left)  lastLeft=false;
  if(!keyState.right) lastRight=false;
  player.x += (player.targetX - player.x) * 0.22;

  if(player.invincible>0) player.invincible--;

  // Spawning — tunda spawn 60 frame pertama agar player punya waktu siap
  const spawnRate = Math.max(45, 90 - Math.floor(score/200)*5);
  if(frameCount>60 && frameCount % spawnRate === 0) spawnObstacle();
  if(frameCount>60 && frameCount % 120 === 0) spawnBonus();
  if(frameCount % 90 === 0) spawnBgCar();

  // Score
  if(frameCount%30===0) { score++; updateHUD(); }

  // Clean off-screen
  obstacles  = obstacles.filter(o=>o.y<H+100);
  bonusItems = bonusItems.filter(b=>b.y<H+60);

  checkCollisions();

  // === DRAW ===
  // Shake
  let sx=0, sy=0;
  if(shakeTimer>0) { sx=(Math.random()-0.5)*8; sy=(Math.random()-0.5)*8; shakeTimer--; }
  ctx.save();
  ctx.translate(sx, sy);

  drawRoad();
  drawBgCars(dt);
  drawObstacles(dt);
  drawBonusItems(dt);
  drawPlayer();
  drawParticles();
  drawLevelUp();

  // Flash red on hit
  if(flashTimer>0) {
    ctx.fillStyle = `rgba(255,0,0,${flashTimer/15*0.3})`;
    ctx.fillRect(0,0,W,H);
    flashTimer--;
  }

  ctx.restore();
  drawSpeedLines();

  animId = requestAnimationFrame(loop);
}

// Init
showMenu();
</script>
