<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebut Ketupat! 🎊</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F5C842;
    --dark-green: #1B4332;
    --green: #2D6A4F;
    --light-green: #52B788;
    --cream: #FFF8E7;
    --red: #E63946;
    --orange: #FB8500;
    --bg: #0D2B1A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', cursive;
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Starry background */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(1); }
    to   { opacity: 1;   transform: scale(1.3); }
  }

  /* Lanterns decorative */
  .lanterns {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 60px;
    pointer-events: none;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 0;
  }
  .lantern {
    font-size: 2rem;
    animation: swingLantern 2.5s ease-in-out infinite alternate;
    transform-origin: top center;
    margin-top: -4px;
  }
  @keyframes swingLantern {
    from { transform: rotate(-12deg); }
    to   { transform: rotate(12deg); }
  }
  .lantern:nth-child(2) { animation-delay: -0.5s; }
  .lantern:nth-child(3) { animation-delay: -1s; }
  .lantern:nth-child(4) { animation-delay: -1.5s; }
  .lantern:nth-child(5) { animation-delay: -0.8s; }
  .lantern:nth-child(6) { animation-delay: -0.3s; }
  .lantern:nth-child(7) { animation-delay: -1.2s; }

  /* ===== SCREENS ===== */
  .screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.4s;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ===== MENU ===== */
  #menu {
    background: radial-gradient(ellipse at 50% 30%, #1B5E35 0%, #0D2B1A 70%);
  }
  .moon {
    font-size: 5rem;
    animation: floatMoon 4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px #F5C842aa);
    margin-bottom: 0.5rem;
  }
  @keyframes floatMoon {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-15px); }
  }
  .game-title {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 30px #F5C84288, 3px 3px 0 #7A6200;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.1;
  }
  .game-subtitle {
    font-family: 'Nunito', sans-serif;
    color: var(--light-green);
    font-size: 1.2rem;
    margin: 0.5rem 0 2rem;
    text-align: center;
  }
  .btn {
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem;
    font-weight: 800;
    border: none;
    border-radius: 50px;
    padding: 0.8rem 3rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.94); }
  .btn-play {
    background: linear-gradient(135deg, var(--gold), var(--orange));
    color: var(--bg);
    box-shadow: 0 6px 0 #7A4000, 0 10px 30px #F5C84244;
  }
  .btn-play:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #7A4000, 0 15px 35px #F5C84266; }
  .high-score-display {
    margin-top: 1.5rem;
    color: #52B788aa;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
  }
  .high-score-display span { color: var(--gold); font-weight: 700; }

  /* ===== GAME CANVAS AREA ===== */
  #game-screen {
    background: transparent;
  }
  .hud {
    position: fixed;
    top: 70px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 20;
    pointer-events: none;
  }
  .hud-box {
    background: rgba(0,0,0,0.5);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 6px 18px;
    color: var(--gold);
    font-size: 1.3rem;
    font-weight: 800;
    backdrop-filter: blur(4px);
  }
  .hud-box .label {
    font-size: 0.65rem;
    color: var(--light-green);
    display: block;
    letter-spacing: 1px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
  }
  .hearts {
    font-size: 1.5rem;
    letter-spacing: 2px;
  }

  #gameCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    cursor: none;
  }

  /* custom cursor */
  #cursor {
    position: fixed;
    width: 40px; height: 40px;
    font-size: 32px;
    text-align: center;
    line-height: 40px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.05s;
    filter: drop-shadow(0 0 8px #F5C84288);
  }

  /* ===== GAME OVER ===== */
  #gameover {
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(8px);
  }
  .go-emoji { font-size: 5rem; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.15) rotate(-5deg); } }
  .go-title {
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 20px #F5C842;
    margin: 0.3rem 0;
  }
  .go-score {
    font-size: 1.5rem;
    color: var(--cream);
    margin-bottom: 0.5rem;
    font-family: 'Nunito', sans-serif;
  }
  .go-score span { color: var(--gold); font-weight: 900; font-size: 2rem; }
  .new-record {
    color: var(--orange);
    font-size: 1.1rem;
    font-weight: 700;
    animation: pulse 1s infinite alternate;
    margin-bottom: 0.5rem;
  }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; transform: scale(1.05); } }
  .go-buttons { display: flex; gap: 1rem; margin-top: 1rem; }
  .btn-retry {
    background: linear-gradient(135deg, var(--green), var(--dark-green));
    color: var(--gold);
    border: 2px solid var(--gold);
    box-shadow: 0 5px 0 #0a1a0f;
  }
  .btn-retry:hover { transform: translateY(-2px); }

  /* Combo popup */
  .combo-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    font-size: 3rem;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 20px #F5C842;
    pointer-events: none;
    z-index: 200;
    animation: comboAnim 0.9s ease-out forwards;
    font-family: 'Baloo 2', cursive;
  }
  @keyframes comboAnim {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    70%  { opacity: 1; transform: translate(-50%, -60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(0.8); }
  }

  /* particles */
  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 199;
    font-size: 1.4rem;
    animation: particleFly 0.8s ease-out forwards;
  }
  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Lanterns -->
<div class="lanterns">
  <span class="lantern">🏮</span>
  <span class="lantern">🏮</span>
  <span class="lantern">🏮</span>
  <span class="lantern">🏮</span>
  <span class="lantern">🏮</span>
  <span class="lantern">🏮</span>
  <span class="lantern">🏮</span>
</div>

<!-- Custom cursor -->
<div id="cursor">🫳</div>

<!-- MENU -->
<div class="screen" id="menu">
  <div class="moon">🌙</div>
  <div class="game-title">REBUT<br>KETUPAT!</div>
  <div class="game-subtitle">Klik / tap ketupat sebelum jatuh ke bawah 🎊</div>
  <button class="btn btn-play" onclick="startGame()">▶ MAIN SEKARANG</button>
  <div class="high-score-display">Rekor Tertinggi: <span id="hs-menu">0</span> poin</div>
</div>

<!-- GAME SCREEN -->
<div class="screen hidden" id="game-screen">
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div class="hud-box">
      <span class="label">SKOR</span>
      <span id="score-disp">0</span>
    </div>
    <div class="hud-box">
      <span class="label">NYAWA</span>
      <div class="hearts" id="lives-disp">❤️❤️❤️</div>
    </div>
    <div class="hud-box">
      <span class="label">LEVEL</span>
      <span id="level-disp">1</span>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="gameover">
  <div class="go-emoji">😢</div>
  <div class="go-title">GAME OVER!</div>
  <div class="go-score">Skor kamu: <span id="final-score">0</span></div>
  <div class="new-record hidden" id="new-record">🏆 REKOR BARU!</div>
  <div class="go-buttons">
    <button class="btn btn-play" onclick="startGame()">🔄 Main Lagi</button>
    <button class="btn btn-retry" onclick="showMenu()">🏠 Menu</button>
  </div>
</div>

<script>
// ===== STARS =====
(function(){
  const s = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const d = document.createElement('div');
    d.className='star';
    const size = Math.random()*2.5+0.5;
    d.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
    s.appendChild(d);
  }
})();

// ===== CURSOR =====
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e=>{
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// ===== GAME STATE =====
let score=0, lives=3, level=1, combo=0, highScore=0;
let items=[], gameRunning=false, animId=null;
let lastSpawn=0, spawnInterval=1200;
let levelTimer=0;

const EMOJIS = {
  ketupat: { e:'🍚', pts:10, chance:0.45 },
  opor:    { e:'🍗', pts:15, chance:0.20 },
  kue:     { e:'🧆', pts:12, chance:0.18 },
  angpao:  { e:'🧧', pts:25, chance:0.08 },
  bom:     { e:'💣', pts:-1, chance:0.09 },
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ===== SCREENS =====
function showMenu(){
  gameRunning=false;
  cancelAnimationFrame(animId);
  items=[];
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('hs-menu').textContent = highScore;
  cursor.textContent = '🫳';
}

function showGameOver(){
  gameRunning=false;
  document.getElementById('final-score').textContent = score;
  const rec = document.getElementById('new-record');
  if(score > highScore){
    highScore = score;
    rec.classList.remove('hidden');
  } else {
    rec.classList.add('hidden');
  }
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('gameover').classList.remove('hidden');
  cursor.textContent = '🫳';
}

function startGame(){
  score=0; lives=3; level=1; combo=0;
  items=[]; lastSpawn=0; spawnInterval=1200; levelTimer=0;
  updateHUD();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  gameRunning=true;
  lastTime=0;
  cursor.textContent = '🤚';
  requestAnimationFrame(gameLoop);
}

function updateHUD(){
  document.getElementById('score-disp').textContent = score;
  document.getElementById('level-disp').textContent = level;
  const h = lives<=0 ? '💔' : '❤️'.repeat(lives);
  document.getElementById('lives-disp').textContent = h;
}

// ===== SPAWN =====
function randomType(){
  const r = Math.random();
  let cumul=0;
  for(const [k,v] of Object.entries(EMOJIS)){
    cumul += v.chance;
    if(r<cumul) return k;
  }
  return 'ketupat';
}

function spawnItem(){
  const type = randomType();
  const e = EMOJIS[type];
  const size = 55 + Math.random()*20;
  const x = size + Math.random()*(canvas.width - size*2);
  const speedY = 1.5 + level*0.6 + Math.random()*0.8;
  const wobble = (Math.random()-0.5)*0.04;
  items.push({
    type, emoji: e.e, pts: e.pts,
    x, y: -size,
    size, speedY, wobble,
    angle: (Math.random()-0.5)*0.3,
    rotSpeed: (Math.random()-0.5)*0.06,
    alpha: 1, dead: false, hit: false,
    scale: 1, hitTimer: 0
  });
}

// ===== CLICK / TAP =====
function handleTap(cx, cy){
  if(!gameRunning) return;
  let hit=false;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.dead||it.hit) continue;
    const dx=cx-it.x, dy=cy-it.y;
    if(Math.sqrt(dx*dx+dy*dy)<it.size*0.65){
      it.hit=true; it.hitTimer=0;
      if(it.type==='bom'){
        lives = Math.max(0, lives-1);
        combo=0;
        spawnParticles(it.x, it.y, ['💥','🔥','😱'], '#ff4444');
        showCombo('💥 BOOM!', '#ff4444');
        cursor.textContent='😱';
        setTimeout(()=>cursor.textContent='🤚',500);
        if(lives<=0){ items=[]; gameRunning=false; setTimeout(showGameOver,400); }
      } else {
        combo++;
        const pts = it.pts * (combo>=3 ? 2 : 1);
        score += pts;
        const colors=['#F5C842','#52B788','#FB8500'];
        spawnParticles(it.x, it.y, ['+'+pts,'✨','🌟'], colors[combo%3===0?0:1]);
        if(combo>=5)      showCombo(`${combo}x COMBO! 🔥`, '#FB8500');
        else if(combo>=3) showCombo(`${combo}x COMBO!`, '#F5C842');
      }
      updateHUD();
      hit=true;
      break;
    }
  }
  if(!hit){ combo=0; }
}

canvas.addEventListener('click', e=>handleTap(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches) handleTap(t.clientX, t.clientY);
},{passive:false});

// ===== PARTICLES =====
function spawnParticles(x,y,emojis,color){
  for(let i=0;i<5;i++){
    const el=document.createElement('div');
    el.className='particle';
    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const angle=Math.random()*Math.PI*2;
    const dist=50+Math.random()*80;
    el.style.cssText=`left:${x}px;top:${y}px;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;color:${color}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),900);
  }
}

function showCombo(text, color){
  const el=document.createElement('div');
  el.className='combo-popup';
  el.textContent=text;
  el.style.color=color;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

// ===== GAME LOOP =====
let lastTime=0;
function gameLoop(ts){
  if(!gameRunning) return;
  if(lastTime===0) lastTime=ts;
  const dt = Math.min(ts-lastTime, 50);
  lastTime=ts;
  levelTimer+=dt;

  // Level up every 15s
  if(levelTimer>15000){
    levelTimer=0;
    level++;
    spawnInterval = Math.max(300, spawnInterval-120);
    updateHUD();
    showCombo(`LEVEL ${level}! 🎉`,'#52B788');
  }

  // Spawn
  if(ts-lastSpawn>spawnInterval){
    spawnItem();
    lastSpawn=ts;
    // Extra spawn mulai level 3, makin sering di level tinggi
    if(level>=3 && Math.random()<0.3) spawnItem();
    if(level>=5 && Math.random()<0.4) spawnItem();
  }

  // Clear
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Update & draw
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(!it.hit){
      it.y += it.speedY * (dt/16);
      it.x += Math.sin(it.y*0.04)*it.wobble*10;
      it.angle += it.rotSpeed;
      // Missed
      if(it.y > canvas.height + it.size){
        if(it.type!=='bom'){
          lives=Math.max(0,lives-1);
          combo=0;
          updateHUD();
          showCombo('KELEWATAN! 😱','#E63946');
          if(lives<=0){ items=[]; gameRunning=false; setTimeout(showGameOver,400); break; }
        }
        items.splice(i,1);
        continue;
      }
    } else {
      it.hitTimer+=dt;
      it.scale = 1 + it.hitTimer/80;
      it.alpha = 1 - it.hitTimer/200;
      if(it.alpha<=0){ items.splice(i,1); continue; }
    }

    // Draw
    ctx.save();
    ctx.globalAlpha = it.alpha;
    ctx.translate(it.x, it.y);
    ctx.rotate(it.angle);
    ctx.scale(it.scale, it.scale);
    ctx.font = `${it.size}px serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    // Glow for special items
    if(it.type==='angpao'){
      ctx.shadowColor='#FF4444';
      ctx.shadowBlur=20;
    } else if(it.type==='bom'){
      ctx.shadowColor='#FF8800';
      ctx.shadowBlur=15;
    }

    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  }

  animId = requestAnimationFrame(gameLoop);
}

// Init
showMenu();
</script>
</body>
</html>
