<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 GameZone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07010f;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:#fff;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(255,60,172,.12),transparent 60%),
             radial-gradient(ellipse 50% 40% at 80% 80%,rgba(0,255,255,.08),transparent 60%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);}
header{text-align:center;padding:36px 20px 16px;position:relative;z-index:1;}
.logo-icon{font-size:3rem;display:block;animation:logoFloat 3s ease-in-out infinite;}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-text{font-family:'Orbitron',monospace;font-size:clamp(2rem,7vw,3.2rem);font-weight:900;letter-spacing:6px;
  background:linear-gradient(135deg,#FF3CAC,#00FFFF,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,60,172,.4));animation:logoGlow 3s ease-in-out infinite;}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 16px rgba(255,60,172,.4))}50%{filter:drop-shadow(0 0 32px rgba(0,255,255,.6))}}
.logo-sub{font-size:.6rem;font-weight:800;letter-spacing:5px;color:rgba(255,255,255,.3);margin-top:4px;}
.stats-row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:50px;
  padding:5px 16px;font-size:.62rem;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.4);}
.stat span{color:#fff;}
.section-lbl{font-family:'Orbitron',monospace;font-size:.6rem;font-weight:700;letter-spacing:5px;
  color:rgba(255,255,255,.2);text-align:center;margin:20px 0 14px;position:relative;z-index:1;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:16px;padding:0 14px 100px;max-width:960px;margin:0 auto;position:relative;z-index:1;}
.card{border-radius:20px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,255,255,.08);text-decoration:none;display:block;
  transition:transform .2s,border-color .2s,box-shadow .2s;animation:cardIn .5s ease both;}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.card:hover,.card:active{transform:translateY(-6px) scale(1.02);
  border-color:var(--accent,rgba(255,60,172,.5));box-shadow:0 10px 36px var(--accent,rgba(255,60,172,.2));}
.thumb{width:100%;height:120px;display:block;position:relative;}
.thumb canvas{width:100%;height:100%;display:block;}
.thumb-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.7) 100%);}
.play-badge{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;backdrop-filter:blur(4px);
  opacity:0;transition:opacity .2s;}
.card:hover .play-badge{opacity:1;}
.card-body{padding:10px 12px 12px;}
.card-cat{font-size:.48rem;font-weight:800;letter-spacing:3px;color:var(--accent,#FF3CAC);margin-bottom:4px;}
.card-name{font-family:'Fredoka One',cursive;font-size:1.1rem;color:#fff;line-height:1.1;}
.card-desc{font-size:.62rem;font-weight:700;color:rgba(255,255,255,.4);margin-top:4px;line-height:1.4;}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:.45rem;font-weight:800;letter-spacing:1px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:2px 7px;color:rgba(255,255,255,.35);}
.new-dot{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#39FF14,#00aa00);
  color:#000;font-size:.42rem;font-weight:900;letter-spacing:2px;padding:3px 8px;border-radius:50px;}
footer{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(7,1,15,.95);
  border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px);padding:10px;text-align:center;}
.footer-txt{font-size:.55rem;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.2);}
</style>
</head>
<body>
<header>
  <span class="logo-icon">🎮</span>
  <div class="logo-text">GAME ZONE</div>
  <div class="logo-sub">KOLEKSI MINI GAME SERU</div>
  <div class="stats-row">
    <div class="stat">🎮 <span>15</span> Game</div>
    <div class="stat">🆓 <span>GRATIS</span></div>
    <div class="stat">📱 <span>Mobile Friendly</span></div>
  </div>
</header>
<div class="section-lbl">— PILIH GAME —</div>
<div class="grid" id="grid"></div>
<footer><div class="footer-txt">GAME ZONE • SEMUA GAME GRATIS • SELAMAT BERMAIN! 🎉</div></footer>

<script>
const GAMES=[
  {name:'Tembak Alien',file:'tembak-alien.html',cat:'SHOOTER',desc:'Hancurkan alien & lawan boss tiap wave 5!',tags:['AUTO-FIRE','BOSS','WAVE'],accent:'rgba(0,255,255,.5)',isNew:true,draw:drawTembakAlien},
  {name:'Ular',file:'snake.html',cat:'CLASSIC',desc:'Makan buah, jangan nabrak diri sendiri!',tags:['LEVEL UP','BUAH SPECIAL'],accent:'rgba(57,255,20,.5)',isNew:true,draw:drawUlar},
  {name:'Spin the Wheel',file:'Spin_the_Wheel.html',cat:'LUCKY',desc:'Putar roda dan menangkan hadiah!',tags:['HADIAH','CONFETTI'],accent:'rgba(255,215,0,.5)',isNew:true,draw:drawSpinWheel},
  {name:'Kuis Berhadiah',file:'Kuis_Berhadiah.html',cat:'EDUKASI',desc:'Jawab soal dan kumpulkan hadiah uang!',tags:['LIFELINE','7 LEVEL'],accent:'rgba(255,107,53,.5)',isNew:true,draw:drawKuis},
  {name:'Ular Tangga',file:'Ular_Tangga.html',cat:'BOARD GAME',desc:'Main bareng, siapa duluan sampai 100!',tags:['2-5 PEMAIN','PODIUM'],accent:'rgba(255,60,172,.5)',isNew:true,draw:drawUlarTangga},
  {name:'Pukul Hewan',file:'whack-a-mole.html',cat:'ARCADE',desc:'Pukul hewan yang muncul, hindari bom!',tags:['COMBO','TIMER'],accent:'rgba(255,60,172,.5)',draw:drawWhack},
  {name:'Road Driver',file:'road-driver.html',cat:'RACING',desc:'Balap 19 lawan, rebut posisi pertama!',tags:['20 PEMBALAP','NITRO'],accent:'rgba(255,107,53,.5)',draw:drawRacing},
  {name:'Basket Mania',file:'basket.html',cat:'SPORT',desc:'Lempar bola ke ring, kumpulkan streak!',tags:['PHYSICS','STREAK'],accent:'rgba(255,165,0,.5)',draw:drawBasket},
  {name:'Puzzle Hewan',file:'puzzle-hewan.html',cat:'PUZZLE',desc:'Susun potongan gambar hewan lucu!',tags:['6 HEWAN','DRAG DROP'],accent:'rgba(199,125,255,.5)',draw:drawPuzzle},
  {name:'Tebak Kata',file:'tebak-kata.html',cat:'EDUKASI',desc:'Tebak nama hewan dari petunjuk!',tags:['28 HEWAN','TIMER'],accent:'rgba(78,205,196,.5)',draw:drawTebakKata},
  {name:'Kucing Petualang',file:'cat-adventure.html',cat:'PLATFORMER',desc:'Lompat, serang musuh, kalahkan boss tiap level!',tags:['3 LEVEL','BOSS','POWER-UP'],accent:'rgba(255,140,0,.5)',isNew:true,draw:drawKucingPetualang},
  {name:'Circus Charlie',file:'circus-charlie.html',cat:'ARCADE',desc:'Lompat api, hindari singa & misi sirkus 10 stage!',tags:['10 STAGE','COMBO','DOUBLE JUMP'],accent:'rgba(255,80,80,.5)',isNew:true,draw:drawCircusCharlie},
  {name:'Angry Birds',file:'angry-birds.html',cat:'PHYSICS',desc:'Lempar burung, hancurkan babi di balik balok!',tags:['PHYSICS','SLINGSHOT','LEVEL'],accent:'rgba(255,80,0,.5)',isNew:true,draw:drawAngryBirds},
  {name:'Penguin Ice Breaker',file:'penguin-ice-breaker.html',cat:'PUZZLE',desc:'Pecahkan es, selamatkan penguin yang terjebak!',tags:['PHYSICS','ES','RESCUE'],accent:'rgba(100,210,255,.5)',isNew:true,draw:drawPenguinIce},
  {name:'Snap! Card',file:'snap-card.html',cat:'KARTU',desc:'SNAP! saat 2 kartu sama — 10 tema, makin cepat!',tags:['1P vs AI','2 PLAYER','10 LEVEL'],accent:'rgba(255,107,157,.5)',isNew:true,draw:drawSnapCard},
];

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}

function drawTembakAlien(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  c.fillStyle='#000010';c.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){c.beginPath();c.arc(Math.random()*W,Math.random()*H,.5+Math.random()*1.5,0,Math.PI*2);c.fillStyle=`rgba(255,255,255,${.1+Math.random()*.5})`;c.fill();}
  c.font='22px serif';c.textAlign='center';c.textBaseline='middle';
  ['👾','🛸','👽','🤖'].forEach((a,row)=>{
    for(let col=0;col<5;col++){c.shadowColor='#00FF88';c.shadowBlur=8;c.fillText(a,30+col*44,30+row*38);}
  });
  c.shadowBlur=0;
  // bullets
  [[80,130],[150,110],[200,140]].forEach(([x,y])=>{
    const g=c.createLinearGradient(x,y,x,y+20);g.addColorStop(0,'#fff');g.addColorStop(1,'#00FFFF');
    c.fillStyle=g;c.shadowColor='#00FFFF';c.shadowBlur=8;c.fillRect(x-2,y,4,20);
  });
  c.shadowBlur=0;
  // ship
  const sx=W/2,sy=H-30;
  c.shadowColor='#00FFFF';c.shadowBlur=16;
  const sg=c.createLinearGradient(sx-20,sy,sx+20,sy);sg.addColorStop(0,'#223');sg.addColorStop(.5,'#aac');sg.addColorStop(1,'#223');
  rr(c,sx-22,sy-16,44,28,6);c.fillStyle=sg;c.fill();
  c.beginPath();c.moveTo(sx,sy-28);c.lineTo(sx+14,sy-10);c.lineTo(sx-14,sy-10);c.closePath();c.fillStyle=sg;c.fill();
  c.beginPath();c.ellipse(sx,sy-10,7,9,0,0,Math.PI*2);c.fillStyle='#00FFFF88';c.fill();
  // left wing
  c.beginPath();c.moveTo(sx-18,sy-8);c.lineTo(sx-38,sy+12);c.lineTo(sx-22,sy+10);c.closePath();c.fillStyle='#226';c.fill();
  c.beginPath();c.moveTo(sx+18,sy-8);c.lineTo(sx+38,sy+12);c.lineTo(sx+22,sy+10);c.closePath();c.fillStyle='#226';c.fill();
  // flame
  const fl=c.createLinearGradient(sx,sy+12,sx,sy+28);fl.addColorStop(0,'#00FFFF');fl.addColorStop(.5,'#0044FF');fl.addColorStop(1,'transparent');
  c.beginPath();c.moveTo(sx-8,sy+12);c.lineTo(sx,sy+26);c.lineTo(sx+8,sy+12);c.fillStyle=fl;c.fill();
  c.shadowBlur=0;
  c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,W,16);
  c.font='bold 10px monospace';c.fillStyle='#00FFFF';c.textAlign='left';c.textBaseline='middle';c.fillText('SKOR 850',6,8);
  c.fillStyle='#FFD93D';c.textAlign='right';c.fillText('WAVE 3',W-6,8);
}

function drawUlar(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  c.fillStyle='#0a0f0a';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(57,255,20,.05)';c.lineWidth=1;
  for(let x=0;x<W;x+=16){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  for(let y=0;y<H;y+=16){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  const seg=[{x:9,y:6},{x:8,y:6},{x:7,y:6},{x:6,y:6},{x:5,y:6},{x:4,y:6},{x:3,y:6},{x:3,y:7},{x:3,y:8},{x:4,y:8}];
  const cs=16;
  seg.forEach((s,i)=>{
    const px=s.x*cs,py=s.y*cs;
    c.shadowColor='#39FF14';c.shadowBlur=i===0?12:5;
    if(i===0){
      const g=c.createRadialGradient(px+cs*.4,py+cs*.35,1,px+cs/2,py+cs/2,cs*.55);
      g.addColorStop(0,'#80FF50');g.addColorStop(1,'#00CC00');
      rr(c,px+1,py+1,cs-2,cs-2,cs*.35);c.fillStyle=g;c.fill();
      c.beginPath();c.arc(px+cs*.62,py+cs*.38,cs*.1,0,Math.PI*2);c.fillStyle='#fff';c.shadowBlur=0;c.fill();
      c.beginPath();c.arc(px+cs*.64,py+cs*.38,cs*.055,0,Math.PI*2);c.fillStyle='#000';c.fill();
    } else {
      const green=`hsl(${120+i*1.5},${90-i*.8}%,${42-i*.5}%)`;
      rr(c,px+2,py+2,cs-4,cs-4,cs*.3);c.fillStyle=green;c.globalAlpha=Math.max(.4,1-i/seg.length*.6);c.fill();c.globalAlpha=1;
    }
    c.shadowBlur=0;
  });
  c.font='20px serif';c.textAlign='center';c.textBaseline='middle';
  c.shadowColor='#39FF14';c.shadowBlur=10;c.fillText('🍎',12*cs+cs/2,4*cs+cs/2);
  c.shadowColor='#FFD93D';c.shadowBlur=10;c.fillText('💎',7*cs+cs/2,10*cs+cs/2);
  c.shadowBlur=0;
  c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,W,16);
  c.font='bold 10px monospace';c.fillStyle='#39FF14';c.textAlign='left';c.textBaseline='middle';c.fillText('SKOR 320',6,8);
  c.fillStyle='#FFD93D';c.textAlign='right';c.fillText('LVL 3',W-6,8);
}

function drawSpinWheel(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  c.fillStyle='#0a0118';c.fillRect(0,0,W,H);
  // bg glow
  const bg=c.createRadialGradient(W/2,H/2,20,W/2,H/2,120);
  bg.addColorStop(0,'rgba(138,43,226,.15)');bg.addColorStop(1,'transparent');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2+8,r=72;
  const segs=['#c62828','#1565c0','#2e7d32','#b71c1c','#6a1b9a','#e65100','#00695c','#f57f17','#4a148c','#1b5e20','#bf360c','#006064','#880e4f','#0d47a1','#33691e'];
  const labels=['ZONK','2K','5K','ZONK','2K','50K','5K','ZONK','2K','5K','100K','2K','ZONK','5K','50K'];
  const n=segs.length,arc=Math.PI*2/n;
  // outer glow ring
  c.beginPath();c.arc(cx,cy,r+8,0,Math.PI*2);
  const ringG=c.createConicalGradient?null:null;
  c.strokeStyle='#FFD700';c.lineWidth=4;c.shadowColor='#FFD700';c.shadowBlur=12;c.stroke();c.shadowBlur=0;
  for(let i=0;i<n;i++){
    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,i*arc,(i+1)*arc);c.closePath();
    c.fillStyle=segs[i];c.fill();
    c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=1;c.stroke();
    c.save();c.translate(cx,cy);c.rotate(i*arc+arc/2);
    c.font=labels[i]==='100K'?'bold 9px sans-serif':'bold 8px sans-serif';
    c.fillStyle=labels[i]==='100K'?'#FFD700':'#fff';
    c.shadowColor='rgba(0,0,0,.8)';c.shadowBlur=3;
    c.textAlign='right';c.textBaseline='middle';c.fillText(labels[i],r-5,0);c.restore();c.shadowBlur=0;
  }
  // decoration bolts
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    c.beginPath();c.arc(cx+Math.cos(a)*(r+6),cy+Math.sin(a)*(r+6),3.5,0,Math.PI*2);
    c.fillStyle='#FFD700';c.shadowColor='#FFD700';c.shadowBlur=6;c.fill();c.shadowBlur=0;
  }
  // center
  const cg=c.createRadialGradient(cx-6,cy-6,2,cx,cy,18);
  cg.addColorStop(0,'#fff');cg.addColorStop(.5,'#FFD700');cg.addColorStop(1,'#FF6D00');
  c.beginPath();c.arc(cx,cy,18,0,Math.PI*2);c.shadowColor='rgba(255,165,0,.8)';c.shadowBlur=12;c.fillStyle=cg;c.fill();c.shadowBlur=0;
  c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=2;c.stroke();
  // pointer
  c.beginPath();c.moveTo(cx,cy-r-18);c.lineTo(cx-8,cy-r-4);c.lineTo(cx+8,cy-r-4);c.closePath();
  c.fillStyle='#FF1744';c.shadowColor='#FF1744';c.shadowBlur=8;c.fill();c.shadowBlur=0;
  c.beginPath();c.arc(cx,cy-r-6,4,0,Math.PI*2);c.fillStyle='#fff';c.fill();
  c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,W,16);
  c.font='bold 10px monospace';c.fillStyle='#FFD700';c.textAlign='center';c.textBaseline='middle';c.fillText('🎡 SPIN THE WHEEL',W/2,8);
}

function drawKuis(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0d0221');bg.addColorStop(1,'#1a0535');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  // stars
  for(let i=0;i<20;i++){c.beginPath();c.arc(Math.random()*W,Math.random()*H,.5+Math.random(),0,Math.PI*2);c.fillStyle=`rgba(255,255,255,${.1+Math.random()*.3})`;c.fill();}
  // ladder levels
  const lvls=[{c:'#FF3CAC',l:'👑 BONUS',p:'Rp50K',active:false},{c:'#E040FB',l:'🤯 Level 6',p:'Rp20K',active:false},{c:'#FF3CAC',l:'💪 Level 5 🛡',p:'Rp10K',active:true},{c:'#FF6D00',l:'🔥 Level 4',p:'Rp5K',active:false},{c:'#FFD740',l:'🤔 Level 3 🛡',p:'Rp2K',active:false}];
  lvls.forEach((lv,i)=>{
    const y=H-22-(i*30),h=22;
    c.fillStyle=lv.active?`${lv.c}22`:'rgba(255,255,255,.03)';
    c.strokeStyle=lv.active?lv.c+'88':'rgba(255,255,255,.08)';
    c.lineWidth=lv.active?1.5:1;
    rr(c,8,y,W-16,h,5);c.fill();c.stroke();
    if(lv.active){c.shadowColor=lv.c;c.shadowBlur=8;}
    c.font=`bold ${lv.active?9:8}px sans-serif`;c.fillStyle=lv.active?lv.c:'rgba(255,255,255,.4)';
    c.textAlign='left';c.textBaseline='middle';c.fillText(lv.l,14,y+h/2);
    c.textAlign='right';c.fillStyle=lv.active?'#FFD700':'rgba(255,255,255,.3)';c.fillText(lv.p,W-12,y+h/2);
    c.shadowBlur=0;
  });
  // question box at top
  c.fillStyle='rgba(255,255,255,.07)';c.strokeStyle='rgba(255,215,0,.3)';c.lineWidth=1;
  rr(c,8,8,W-16,36,6);c.fill();c.stroke();
  c.font='bold 8px sans-serif';c.fillStyle='rgba(0,255,255,.7)';c.textAlign='left';c.textBaseline='top';c.fillText('🔢 Matematika',13,13);
  c.fillStyle='#fff';c.font='bold 11px sans-serif';c.fillText('3 × 4 = ?',13,24);
  // timer
  c.beginPath();c.arc(W-22,20,10,0,Math.PI*2);c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=3;c.stroke();
  c.beginPath();c.arc(W-22,20,10,-Math.PI/2,Math.PI*0.8);c.strokeStyle='#FFD700';c.lineWidth=3;c.stroke();
  c.font='bold 8px monospace';c.fillStyle='#FFD700';c.textAlign='center';c.textBaseline='middle';c.fillText('8',W-22,20);
}

function drawUlarTangga(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#1a0533');bg.addColorStop(1,'#0d0221');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  const cell=26,cols=8,rows=8,offX=(W-cols*cell)/2,offY=(H-rows*cell)/2;
  const rc=[['#1a237e','#283593'],['#1b5e20','#2e7d32'],['#4a148c','#6a1b9a'],['#bf360c','#d84315'],['#004d40','#00695c'],['#0d47a1','#1565c0'],['#4e342e','#6d4c41'],['#311b92','#4527a0']];
  for(let r=0;r<rows;r++) for(let col=0;col<cols;col++){
    const x=offX+col*cell,y=offY+r*cell;
    const [c1,c2]=rc[r%rc.length];
    const g=c.createLinearGradient(x,y,x+cell,y+cell);
    g.addColorStop(0,(r+col)%2===0?c1+'cc':c2+'cc');g.addColorStop(1,(r+col)%2===0?c2+'99':c1+'99');
    c.fillStyle=g;c.fillRect(x,y,cell,cell);
    c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=.5;c.strokeRect(x,y,cell,cell);
    // number
    const n=(rows-1-r)*cols+col+1;
    c.font='5px sans-serif';c.fillStyle='rgba(255,255,255,.4)';c.textAlign='left';c.textBaseline='top';c.fillText(n,x+2,y+2);
  }
  // ladders
  [[{x:1,y:7},{x:4,y:4}],[{x:6,y:5},{x:2,y:2}]].forEach(([a,b])=>{
    const ax=offX+a.x*cell+cell/2,ay=offY+a.y*cell+cell/2;
    const bx=offX+b.x*cell+cell/2,by=offY+b.y*cell+cell/2;
    const ang=Math.atan2(by-ay,bx-ax),perp=ang+Math.PI/2;
    c.shadowColor='#4CAF50';c.shadowBlur=6;
    [[5],[-5]].forEach(([off])=>{
      c.beginPath();c.moveTo(ax+Math.cos(perp)*off,ay+Math.sin(perp)*off);
      c.lineTo(bx+Math.cos(perp)*off,by+Math.sin(perp)*off);
      c.strokeStyle='#66BB6A';c.lineWidth=2.5;c.stroke();
    });
    const dist=Math.hypot(bx-ax,by-ay),steps=Math.max(3,Math.floor(dist/20));
    for(let i=1;i<steps;i++){
      const t=i/steps,mx=ax+(bx-ax)*t,my=ay+(by-ay)*t;
      c.beginPath();c.moveTo(mx+Math.cos(perp)*5,my+Math.sin(perp)*5);c.lineTo(mx-Math.cos(perp)*5,my-Math.sin(perp)*5);
      c.strokeStyle='#A5D6A7';c.lineWidth=1.5;c.stroke();
    }
    c.shadowBlur=0;
  });
  // snakes
  [[{x:7,y:1},{x:5,y:5}],[{x:3,y:3},{x:1,y:6}]].forEach(([a,b])=>{
    const ax=offX+a.x*cell+cell/2,ay=offY+a.y*cell+cell/2;
    const bx=offX+b.x*cell+cell/2,by=offY+b.y*cell+cell/2;
    c.beginPath();c.moveTo(ax,ay);c.bezierCurveTo(ax+20,ay+20,bx-20,by-20,bx,by);
    c.strokeStyle='#FF1744';c.lineWidth=5;c.lineCap='round';c.shadowColor='#FF1744';c.shadowBlur=8;c.stroke();
    c.beginPath();c.moveTo(ax,ay);c.bezierCurveTo(ax+20,ay+20,bx-20,by-20,bx,by);
    c.strokeStyle='#FF6D00';c.lineWidth=3;c.setLineDash([6,5]);c.stroke();c.setLineDash([]);c.shadowBlur=0;
    c.beginPath();c.arc(ax,ay,5,0,Math.PI*2);c.fillStyle='#FF1744';c.shadowColor='#FF1744';c.shadowBlur=6;c.fill();c.shadowBlur=0;
  });
  // tokens
  [{col:2,row:6,c:'#FF5252'},{col:5,row:3,c:'#448AFF'},{col:4,row:7,c:'#69F0AE'}].forEach(t=>{
    const px=offX+t.col*cell+cell/2,py=offY+t.row*cell+cell/2;
    const g=c.createRadialGradient(px-3,py-3,1,px,py,10);g.addColorStop(0,'#fff');g.addColorStop(1,t.c);
    c.beginPath();c.arc(px,py,10,0,Math.PI*2);c.fillStyle=g;c.shadowColor=t.c;c.shadowBlur=8;c.fill();
    c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=1.5;c.stroke();c.shadowBlur=0;
  });
  c.font='14px serif';c.textAlign='center';c.textBaseline='middle';c.shadowColor='#FFD700';c.shadowBlur=10;
  c.fillText('⭐',offX+(cols-1)*cell+cell/2,offY+cell/2);c.shadowBlur=0;
}

function drawPuzzle(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#1a0533');bg.addColorStop(1,'#0d0221');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  const pw=38,gap=3,cols=4,rows=4,offX=(W-cols*(pw+gap)+gap)/2,offY=(H-rows*(pw+gap)+gap)/2;
  const pColors=['#FF5252','#448AFF','#69F0AE','#FFD740','#EA80FC','#80D8FF','#FF6D00','#4DB6AC','#F06292','#AED581','#FFB74D','#90CAF9','#CE93D8','#80CBC4','#FFF176','#BCAAA4'];
  let pi=0;
  for(let r=0;r<rows;r++) for(let col=0;col<cols;col++,pi++){
    const x=offX+col*(pw+gap),y=offY+r*(pw+gap);
    const placed=pi<11;
    if(placed){
      const g=c.createLinearGradient(x,y,x+pw,y+pw);
      g.addColorStop(0,pColors[pi]);g.addColorStop(1,pColors[pi]+'88');
      c.shadowColor=pColors[pi];c.shadowBlur=placed?6:0;
      rr(c,x,y,pw,pw,4);c.fillStyle=g;c.fill();
      c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1;c.stroke();c.shadowBlur=0;

      c.fillStyle='rgba(0,0,0,.1)';
      c.beginPath();c.arc(x+pw/2,y+pw/2,pw*.25,0,Math.PI*2);c.fill();
    } else {
      c.fillStyle='rgba(255,255,255,.04)';c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1;c.setLineDash([4,3]);
      rr(c,x,y,pw,pw,4);c.fill();c.stroke();c.setLineDash([]);
    }
  }
  c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,0,W,16);
  c.font='bold 10px monospace';c.fillStyle='#EA80FC';c.textAlign='center';c.textBaseline='middle';c.fillText('🧩 PUZZLE HEWAN',W/2,8);
}

  c.beginPath();c.ellipse(23,5,8,7,.2,0,Math.PI*2);c.fill();

  c.beginPath();c.arc(26,-2,3.5,0,Math.PI*2);c.fill();

  c.strokeStyle='#bbb';c.lineWidth=2;c.beginPath();c.moveTo(2,9);c.quadraticCurveTo(-5,3,-3,-2);c.stroke();

  [{x:W*.04,y:H*.82-10,col:'#FF4444'},{x:W*.04+20,y:H*.82-10,col:'#FFB800'},{x:W*.04+40,y:H*.82-10,col:'#4488FF'}].forEach(b=>{
    c.beginPath();c.arc(b.x,b.y,8,0,Math.PI*2);c.fillStyle=b.col;c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(b.x+2,b.y-2,3,0,Math.PI*2);c.fill();
    c.fillStyle='#333';c.beginPath();c.arc(b.x+3,b.y-2,1.5,0,Math.PI*2);c.fill();
  });
  // Structure - wooden blocks
  const bks=[[W*.6,H*.78-30,28,30],[W*.64,H*.78-60,28,30],[W*.75,H*.78-30,28,30],[W*.79,H*.78-60,28,30]];
  bks.forEach(([bkx,bky,bkw,bkh])=>{
    const wg=c.createLinearGradient(bkx,bky,bkx,bky+bkh);wg.addColorStop(0,'#D4A055');wg.addColorStop(1,'#A0722A');
    c.fillStyle=wg;rr(c,bkx,bky,bkw,bkh,2);c.fill();
    c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1;c.stroke();
    c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=1;
    c.beginPath();c.moveTo(bkx+5,bky+5);c.lineTo(bkx+bkw-5,bky+bkh-5);c.stroke();
  });
  // Pig on top
  c.beginPath();c.arc(W*.71,H*.78-72,12,0,Math.PI*2);c.fillStyle='#7BC67E';c.fill();
  c.beginPath();c.arc(W*.71,H*.78-72,12,0,Math.PI*2);c.strokeStyle='#5a9a5a';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#5a9a5a';c.beginPath();c.ellipse(W*.71,H*.78-67,4,3,0,0,Math.PI*2);c.fill();
  c.fillStyle='#000';c.beginPath();c.arc(W*.68,H*.78-74,2,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(W*.74,H*.78-74,2,0,Math.PI*2);c.fill();
  // Trajectory arc
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1.5;c.setLineDash([5,6]);
  c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(W*.45,H*.1,W*.7,H*.78-80);c.stroke();c.setLineDash([]);
  // HUD
  c.fillStyle='rgba(30,10,0,.65)';c.fillRect(0,0,W,17);
  c.font='bold 10px monospace';c.textBaseline='middle';
  c.fillStyle='#FFD700';c.textAlign='left';c.fillText('SCORE: 3200',6,8);
  c.fillStyle='#FF5252';c.textAlign='center';c.fillText('⭐⭐⭐',W/2,8);
  c.fillStyle='#fff';c.textAlign='right';c.fillText('LVL 3',W-6,8);
}

function drawPenguinIce(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  // Dark ocean bg
  const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#001830');bg.addColorStop(1,'#003060');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  // Stars
  for(let i=0;i<25;i++){c.beginPath();c.arc(Math.random()*W,Math.random()*H*.4,.8+Math.random(),0,Math.PI*2);c.fillStyle=`rgba(255,255,255,${.2+Math.random()*.5})`;c.fill();}
  // Aurora effect
  const aur=c.createLinearGradient(0,0,W,H*.5);
  aur.addColorStop(0,'rgba(0,200,150,.06)');aur.addColorStop(.5,'rgba(100,210,255,.1)');aur.addColorStop(1,'rgba(0,200,150,.06)');
  c.fillStyle=aur;c.fillRect(0,0,W,H*.5);
  // Ice platform grid - 4x4
  const iw=44,ih=26,gap=4,cols=4,rows=3;
  const offX=(W-cols*(iw+gap)+gap)/2, offY=H*.35;
  // Ice block colors
  const iceColors=['#A8E6F0','#7DD4E8','#5CBCD8','#A8E6F0','#7DD4E8','#5CBCD8','#A8E6F0','#7DD4E8','#5CBCD8','#A8E6F0','#7DD4E8','#5CBCD8'];
  let bi=0;
  for(let r=0;r<rows;r++){
    for(let col=0;col<cols;col++,bi++){
      const ix=offX+col*(iw+gap), iy=offY+r*(ih+gap);
      const broken=bi===5||bi===9;
      const hasPenguin=bi===2||bi===7;
      if(broken){
        // Cracked ice pieces
        c.fillStyle='rgba(100,180,210,.4)';
        [[0,0,18,ih*.8],[iw*.4,ih*.2,iw*.55,ih*.75]].forEach(([px,py,pw,ph])=>{
          rr(c,ix+px,iy+py,pw,ph,3);c.fill();
          c.strokeStyle='rgba(200,240,255,.3)';c.lineWidth=1;c.stroke();
        });
      } else {
        const iceg=c.createLinearGradient(ix,iy,ix,iy+ih);
        iceg.addColorStop(0,'#C8F0FF');iceg.addColorStop(1,iceColors[bi]);
        rr(c,ix,iy,iw,ih,5);c.fillStyle=iceg;c.fill();
        c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.5;c.stroke();
        // Ice shine
        c.fillStyle='rgba(255,255,255,.3)';
        c.beginPath();c.ellipse(ix+iw*.3,iy+ih*.25,iw*.12,ih*.1,-.3,0,Math.PI*2);c.fill();
        if(hasPenguin){
          // Penguin on ice
          const px=ix+iw/2, py=iy-2;
          // Body
          c.fillStyle='#1a1a2e';c.beginPath();c.ellipse(px,py-8,7,10,0,0,Math.PI*2);c.fill();
          // Belly
          c.fillStyle='#fff';c.beginPath();c.ellipse(px+1,py-7,4,7,0,0,Math.PI*2);c.fill();
          // Head
          c.fillStyle='#1a1a2e';c.beginPath();c.arc(px,py-18,7,0,Math.PI*2);c.fill();
          // Eyes
          c.fillStyle='#fff';c.beginPath();c.arc(px+2,py-20,2.5,0,Math.PI*2);c.fill();
          c.fillStyle='#000';c.beginPath();c.arc(px+3,py-20,1.2,0,Math.PI*2);c.fill();
          // Beak
          c.fillStyle='#FF9900';c.beginPath();c.moveTo(px+6,py-18);c.lineTo(px+10,py-17);c.lineTo(px+6,py-16);c.closePath();c.fill();
          // Scarf
          c.strokeStyle='#FF4444';c.lineWidth=3;c.lineCap='round';
          c.beginPath();c.moveTo(px-5,py-12);c.lineTo(px+6,py-12);c.stroke();
        }
      }
    }
  }
  // Water below
  const wg=c.createLinearGradient(0,H*.78,0,H);wg.addColorStop(0,'#0055AA');wg.addColorStop(1,'#003377');
  c.fillStyle=wg;c.fillRect(0,H*.78,W,H*.22);
  // Wave lines
  c.strokeStyle='rgba(100,200,255,.25)';c.lineWidth=1.5;
  for(let wx=0;wx<W+20;wx+=24){
    c.beginPath();c.moveTo(wx,H*.8);c.quadraticCurveTo(wx+10,H*.78,wx+20,H*.8);c.stroke();
  }
  // Falling ice pieces from broken blocks
  [[W*.42,H*.72,'#7DD4E8'],[W*.48,H*.76,'#A8E6F0']].forEach(([fx,fy,fc])=>{
    c.save();c.translate(fx,fy);c.rotate(.4);
    rr(c,-8,-5,16,10,2);c.fillStyle=fc+'99';c.fill();
    c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;c.stroke();
    c.restore();
  });
  // HUD
  c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,W,17);
  c.font='bold 10px monospace';c.textBaseline='middle';
  c.fillStyle='#FFE566';c.textAlign='left';c.fillText('LVL 4',6,8);
  c.fillStyle='#7DD4E8';c.textAlign='center';c.fillText('🐧 × 3',W/2,8);
  c.fillStyle='#fff';c.textAlign='right';c.fillText('SKOR 840',W-6,8);
}

function drawSnapCard(cv){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;
  // Pink warm bg
  const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#FF6B9D');bg.addColorStop(1,'#FF9F43');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  // Subtle pattern
  c.strokeStyle='rgba(255,255,255,.08)';c.lineWidth=1;
  for(let x=0;x<W;x+=20){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  // Left card
  const cx=W/2;
  [[cx-38,H/2-8,'#fff','🐶','Anjing','#FF6B9D'],[cx+10,H/2-8,'#fff','🐶','Anjing','#FF9F43']].forEach(([x,y,bg3,emoji,name,bc],i)=>{
    c.shadowColor=bc;c.shadowBlur=i===1?18:8;
    rr(c,x,y-44,52,70,10);c.fillStyle=bg3;c.fill();
    c.strokeStyle=bc;c.lineWidth=i===1?3:2;c.stroke();
    c.shadowBlur=0;
    c.font='30px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(emoji,x+26,y-14);
    c.font='bold 8px sans-serif';c.fillStyle='#888';c.textAlign='center';c.textBaseline='bottom';c.fillText(name,x+26,y+22);
  });
  // SNAP flash effect on matching cards
  c.fillStyle='rgba(255,220,0,.18)';c.beginPath();c.arc(cx+36,H/2-8,46,0,Math.PI*2);c.fill();
  // SNAP button
  const btnY=H*.82;
  c.shadowColor='#CC3366';c.shadowBlur=14;
  const btng=c.createLinearGradient(cx-50,btnY,cx-50,btnY+30);
  btng.addColorStop(0,'#FF6B9D');btng.addColorStop(1,'#CC3366');
  rr(c,cx-50,btnY-15,100,30,20);c.fillStyle=btng;c.fill();c.shadowBlur=0;
  c.font='bold 15px Fredoka One,cursive';c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
  c.fillText('SNAP! 🖐',cx,btnY);
  // Score dots - level progress
  const dotY=H*.12;
  for(let i=0;i<10;i++){
    c.beginPath();c.arc(W*.18+i*(W*.065),dotY,4,0,Math.PI*2);
    c.fillStyle=i<3?'#FF6B9D':i===3?'#FF9F43':'rgba(255,255,255,.25)';
    c.fill();
  }
  // HUD
  c.fillStyle='rgba(0,0,0,.3)';c.fillRect(0,0,W,17);
  c.font='bold 10px monospace';c.textBaseline='middle';
  c.fillStyle='#fff';c.textAlign='left';c.fillText('🤖 0',6,8);
  c.fillStyle='#FFD700';c.textAlign='center';c.fillText('LEVEL 1 • 🐾 HEWAN',W/2,8);
  c.fillStyle='#fff';c.textAlign='right';c.fillText('0 😊',W-6,8);
}

function buildCards(){
  const grid=document.getElementById('grid');
  GAMES.forEach((g,i)=>{
    const card=document.createElement('a');
    card.className='card';card.href=g.file;
    card.style.cssText=`--accent:${g.accent};animation-delay:${i*.07}s`;
    const thumbDiv=document.createElement('div');thumbDiv.className='thumb';
    const cv=document.createElement('canvas');cv.width=340;cv.height=240;
    thumbDiv.appendChild(cv);
    const ov=document.createElement('div');ov.className='thumb-overlay';thumbDiv.appendChild(ov);
    if(g.isNew){const nb=document.createElement('div');nb.className='new-dot';nb.textContent='NEW';thumbDiv.appendChild(nb);}
    const pb=document.createElement('div');pb.className='play-badge';pb.textContent='▶';thumbDiv.appendChild(pb);
    card.appendChild(thumbDiv);
    const body=document.createElement('div');body.className='card-body';
    body.innerHTML=`<div class="card-cat">${g.cat}</div><div class="card-name">${g.name}</div><div class="card-desc">${g.desc}</div><div class="card-tags">${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
    card.appendChild(body);grid.appendChild(card);
    g.draw(cv);
  });
}
buildCards();
</script>
