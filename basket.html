<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏀 Basket!</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;}
body{background:#1a0800;font-family:'Nunito',sans-serif;}
canvas{display:block;position:fixed;top:0;left:0;}

/* UI overlay */
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10;}
#hud{display:none;justify-content:space-between;align-items:center;padding:10px 14px;}
.hbox{background:rgba(0,0,0,.65);border:1.5px solid rgba(255,140,0,.35);border-radius:12px;padding:5px 14px;text-align:center;}
.hl{font-size:.5rem;font-weight:800;letter-spacing:2px;color:rgba(255,140,0,.6);}
.hv{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:#fff;line-height:1;}
.hv.gold{color:#FFD93D;text-shadow:0 0 8px #FFD93D;}
.hv.fire{color:#FF3CAC;}

/* timer ring */
.tring{position:relative;width:54px;height:54px;}
.tsvg{transform:rotate(-90deg);}
.tbg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4;}
.tarc{fill:none;stroke:#FF6B1A;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s;}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:1.2rem;color:#fff;}

/* hint */
#hint{display:none;position:fixed;bottom:130px;width:100%;text-align:center;font-size:.65rem;font-weight:800;letter-spacing:2px;color:rgba(255,165,0,.5);animation:hblink 1.5s ease-in-out infinite;pointer-events:none;z-index:10;}
@keyframes hblink{0%,100%{opacity:.4}50%{opacity:1}}

/* score popup */
.spop{position:fixed;font-family:'Bebas Neue',cursive;font-size:2rem;pointer-events:none;z-index:20;animation:sfly .8s ease forwards;}
@keyframes sfly{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}

/* confetti canvas */
#confCv{position:fixed;inset:0;pointer-events:none;z-index:15;}

/* SCREENS */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:30;padding:20px;text-align:center;pointer-events:all;}
.screen.on{display:flex;}
#menuBg{background:linear-gradient(180deg,#1a0a2e,#2a0a00);}
#resBg{background:rgba(0,0,0,.93);}

.big-ball{font-size:5rem;animation:bb 1s ease-in-out infinite;display:block;}
@keyframes bb{0%,100%{transform:translateY(0) scaleY(1) scaleX(1)}45%{transform:translateY(-28px) scaleY(1.05) scaleX(.95)}90%{transform:translateY(2px) scaleY(.85) scaleX(1.15)}}
.gtitle{font-family:'Bebas Neue',cursive;font-size:3.8rem;color:#FF6B1A;text-shadow:0 0 20px #FF6B1A88,4px 4px 0 rgba(0,0,0,.5);line-height:.9;}
.bboard{background:rgba(0,0,0,.5);border:2px solid #FF6B1A;border-radius:16px;padding:10px 32px;}
.blbl{font-size:.55rem;font-weight:800;letter-spacing:3px;color:rgba(255,140,0,.6);}
.bval{font-family:'Bebas Neue',cursive;font-size:2.4rem;color:#FFD93D;text-shadow:0 0 10px #FFD93D;}
.drow{display:flex;gap:8px;width:100%;}
.db{flex:1;padding:10px 4px;border-radius:14px;border:2px solid;background:rgba(0,0,0,.4);cursor:pointer;font-family:'Bebas Neue',cursive;font-size:1rem;transition:all .2s;pointer-events:all;}
.db.d1{border-color:#39FF14;color:#39FF14;}
.db.d2{border-color:#FFD93D;color:#FFD93D;}
.db.d3{border-color:#FF3CAC;color:#FF3CAC;}
.db small{display:block;font-family:'Nunito',sans-serif;font-size:.52rem;font-weight:800;opacity:.6;letter-spacing:1px;}
.db.sel,.db:active{background:rgba(255,255,255,.14);transform:scale(1.05);}
.bplay{font-family:'Bebas Neue',cursive;font-size:1.7rem;letter-spacing:3px;background:linear-gradient(135deg,#FF6B1A,#FF3CAC);color:#fff;border:none;border-radius:50px;padding:14px 54px;cursor:pointer;box-shadow:0 0 22px #FF6B1A88,0 6px 0 #7a2200;transition:all .15s;pointer-events:all;}
.bplay:active{transform:translateY(5px);box-shadow:0 0 10px #FF6B1A44,0 1px 0 #7a2200;}

/* result */
.rtitle{font-family:'Bebas Neue',cursive;font-size:2.8rem;color:#FF6B1A;text-shadow:0 0 20px #FF6B1A;}
.rscore{font-family:'Bebas Neue',cursive;font-size:5rem;color:#FFD93D;text-shadow:0 0 20px #FFD93D;animation:rpop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes rpop{from{transform:scale(0)}to{transform:scale(1)}}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
.rstat{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;border:1px solid rgba(255,140,0,.2);}
.rsl{font-size:.5rem;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.4);}
.rsv{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:#fff;}
.rbtns{display:flex;gap:10px;margin-top:4px;}
.rlagi{font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;background:#FF6B1A;color:#fff;border:none;border-radius:50px;padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 #7a2200;pointer-events:all;}
.rlagi:active{transform:translateY(4px);}
.rhome{font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;background:transparent;color:#FFD93D;border:2px solid #FFD93D;border-radius:50px;padding:10px 22px;cursor:pointer;pointer-events:all;}
</style>
</head>
<body>

<canvas id="gc"></canvas>
<canvas id="confCv"></canvas>

<div id="ui">
  <div id="hud" style="display:none;">
    <div class="hbox"><div class="hl">SKOR</div><div class="hv gold" id="sHud">0</div></div>
    <div class="tring">
      <svg class="tsvg" width="54" height="54" viewBox="0 0 54 54">
        <circle class="tbg" cx="27" cy="27" r="22"/>
        <circle class="tarc" id="tArc" cx="27" cy="27" r="22" stroke-dasharray="138" stroke-dashoffset="0"/>
      </svg>
      <div class="tnum" id="tNum">60</div>
    </div>
    <div class="hbox"><div class="hl">STREAK</div><div class="hv fire" id="stHud">0</div></div>
  </div>
</div>
<div id="hint">↑ SERET KE ATAS UNTUK LEMPAR ↑</div>

<!-- MENU -->
<div class="screen on" id="menuBg">
  <span class="big-ball">🏀</span>
  <div class="gtitle">BASKET<br>MANIA</div>
  <div class="bboard">
    <div class="blbl">SKOR TERBAIK</div>
    <div class="bval" id="bestDisp">0</div>
  </div>
  <div class="drow">
    <div class="db d1 sel" onclick="pickDiff('easy',this)">GAMPANG<small>RING BESAR</small></div>
    <div class="db d2" onclick="pickDiff('med',this)">NORMAL<small>RING GERAK</small></div>
    <div class="db d3" onclick="pickDiff('hard',this)">SUSAH<small>NGEBUT!</small></div>
  </div>
  <button class="bplay" onclick="startGame()">▶ MAIN!</button>
</div>

<!-- RESULT -->
<div class="screen" id="resBg">
  <div class="rtitle" id="rTitle">GAME OVER</div>
  <div class="rscore" id="rScore">0</div>
  <div style="font-size:.55rem;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.3);">POIN</div>
  <div class="rgrid">
    <div class="rstat"><div class="rsl">MASUK</div><div class="rsv" id="rMasuk">0</div></div>
    <div class="rstat"><div class="rsl">MISS</div><div class="rsv" id="rMiss">0</div></div>
    <div class="rstat"><div class="rsl">AKURASI</div><div class="rsv" id="rAcc">0%</div></div>
    <div class="rstat"><div class="rsl">MAX STREAK</div><div class="rsv" id="rStr">0</div></div>
  </div>
  <div class="rbtns">
    <button class="rlagi" onclick="startGame()">🔄 LAGI!</button>
    <button class="rhome" onclick="goMenu()">🏠 MENU</button>
  </div>
</div>

<script>
const gc = document.getElementById('gc');
const ctx = gc.getContext('2d');
let W, H;

function resize(){
  W = gc.width  = window.innerWidth;
  H = gc.height = window.innerHeight;
}
resize();
window.addEventListener('resize', ()=>{ resize(); if(gameOn) resetBallPos(); });

// =============================================
// CONFIG
// =============================================
const DIFFS = {
  easy: {rimW:90,  speed:0,   time:60},
  med:  {rimW:68,  speed:1.4, time:60},
  hard: {rimW:58,  speed:2.6, time:60},
};
let diff = 'easy';
let best = 0;

// =============================================
// STATE
// =============================================
let score=0, streak=0, maxStreak=0, shots=0, made=0;
let timeLeft=60, tInt=null, gameOn=false;
let ball={x:0,y:0,vx:0,vy:0,r:0,flying:false,trail:[]};
let rim={x:0,y:0,w:0,dir:1};
let drag={on:false,sx:0,sy:0,cx:0,cy:0};
let scored=false;
let crowd=[];

// =============================================
// AUDIO
// =============================================
let _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function beep(f,d,t,v,dl){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t||'sine';o.frequency.setValueAtTime(f,a.currentTime+(dl||0));g.gain.setValueAtTime(v||.3,a.currentTime+(dl||0));g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(dl||0)+d);o.start(a.currentTime+(dl||0));o.stop(a.currentTime+(dl||0)+d+.05);}catch(e){}}
function sndSwish(){beep(800,.06,'sine',.3);beep(1000,.08,'sine',.2,.06);beep(1200,.1,'sine',.25,.12);}
function sndBounce(){beep(280,.06,'square',.2);}
function sndMiss(){beep(200,.18,'sawtooth',.2);}
function sndStreak(){[659,784,1047,1319].forEach((f,i)=>beep(f,.12,'triangle',.3,i*.06));}
function sndTick(){beep(880,.04,'square',.1);}
function sndWin(){[523,659,784,1047,1319,1568].forEach((f,i)=>beep(f,.3,'triangle',.3,i*.07));}

// =============================================
// INPUT — use window coordinates directly
// =============================================
function getTouchPos(e){
  const t = e.changedTouches ? e.changedTouches[0] : e.touches ? e.touches[0] : e;
  if(!t) return null;
  return {x: t.clientX, y: t.clientY};
}

window.addEventListener('touchstart', e=>{
  // Don't intercept taps on menu/result screens
  if(!gameOn) return;
  e.preventDefault();
  if(ball.flying) return;
  const p = getTouchPos(e);
  if(!p) return;
  drag.on=true; drag.sx=p.x; drag.sy=p.y; drag.cx=p.x; drag.cy=p.y;
}, {passive:false});

window.addEventListener('touchmove', e=>{
  if(!gameOn || !drag.on) return;
  e.preventDefault();
  const p = getTouchPos(e);
  if(!p) return;
  drag.cx=p.x; drag.cy=p.y;
}, {passive:false});

window.addEventListener('touchend', e=>{
  if(!gameOn || !drag.on) return;
  e.preventDefault();
  drag.on=false;
  const p = getTouchPos(e);
  if(p){ drag.cx=p.x; drag.cy=p.y; }
  doShoot();
}, {passive:false});

// Mouse fallback
window.addEventListener('mousedown', e=>{ if(!gameOn||ball.flying)return; drag.on=true; drag.sx=e.clientX; drag.sy=e.clientY; drag.cx=e.clientX; drag.cy=e.clientY; });
window.addEventListener('mousemove', e=>{ if(!drag.on)return; drag.cx=e.clientX; drag.cy=e.clientY; });
window.addEventListener('mouseup',   e=>{ if(!drag.on)return; drag.on=false; drag.cx=e.clientX; drag.cy=e.clientY; doShoot(); });

function doShoot(){
  if(!gameOn || ball.flying) return;
  const dx = drag.cx - drag.sx;
  const dy = drag.cy - drag.sy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist < 10 || dy > 20) return; // too small or downward
  document.getElementById('hint').style.display='none';
  const power = Math.min(dist, 300);
  // Arah drag ke atas = dy negatif, atan2(-dy,-dx) = arah ke atas → benar
  const angle = Math.atan2(dy, dx);
  const spd = power * 0.085;
  ball.vx = Math.cos(angle)*spd;
  ball.vy = Math.sin(angle)*spd;
  ball.flying = true;
  ball.trail = [];
  shots++;
}

// =============================================
// MENU
// =============================================
function pickDiff(d,el){
  diff=d;
  document.querySelectorAll('.db').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

// =============================================
// START
// =============================================
function startGame(){
  resize();
  score=0;streak=0;maxStreak=0;shots=0;made=0;scored=false;
  timeLeft=DIFFS[diff].time;
  gameOn=true; ball.flying=false; drag.on=false;

  ball.r = Math.max(18, Math.min(24, W*0.055));
  resetBallPos();

  rim.w = DIFFS[diff].rimW;
  rim.x = W/2;
  rim.y = H*0.25;
  rim.dir = 1;

  // crowd dots
  crowd=[];
  for(let i=0;i<100;i++) crowd.push({x:Math.random()*W, y:Math.random()*H*0.22, col:`hsl(${Math.random()*360},55%,${35+Math.random()*35}%)`, r:2+Math.random()*4, w:Math.random()*Math.PI*2});

  hideScreens();
  document.getElementById('hud').style.display='flex';
  document.getElementById('hint').style.display='block';
  lastT=null;
  updateHUD();
  startTimer();
  requestAnimationFrame(loop);
}

function resetBallPos(){
  ball.x = W/2;
  ball.y = H*0.85;
  ball.vx=0; ball.vy=0;
  ball.trail=[];
}

function startTimer(){
  clearInterval(tInt);
  const total=DIFFS[diff].time;
  document.getElementById('tArc').style.transition='none';
  document.getElementById('tArc').style.strokeDashoffset='0';
  setTimeout(()=>{
    document.getElementById('tArc').style.transition=`stroke-dashoffset ${total}s linear`;
    document.getElementById('tArc').style.strokeDashoffset='138';
  },50);

  tInt=setInterval(()=>{
    timeLeft--;
    document.getElementById('tNum').textContent=timeLeft;
    document.getElementById('tArc').style.stroke = timeLeft<=10?'#FF6B6B':timeLeft<=20?'#FFD93D':'#FF6B1A';
    if(timeLeft<=10) sndTick();
    if(timeLeft<=0){ clearInterval(tInt); gameOn=false; setTimeout(endGame,600); }
  },1000);
}

// =============================================
// GAME LOOP
// =============================================
const G = 0.55;
let lastT=null;
function loop(ts){
  if(lastT===null) lastT=ts;
  const dt = Math.min((ts-lastT)/16.67, 3);
  lastT=ts;
  update(dt);
  draw();
  if(gameOn || ball.flying) requestAnimationFrame(loop);
}

function update(dt){
  // Move rim
  if(gameOn && DIFFS[diff].speed>0){
    rim.x += rim.dir * DIFFS[diff].speed * dt;
    const margin = rim.w/2+20;
    if(rim.x > W-margin) rim.dir=-1;
    if(rim.x < margin)   rim.dir=1;
  }
  if(!ball.flying) return;

  ball.trail.push({x:ball.x, y:ball.y});
  if(ball.trail.length>20) ball.trail.shift();

  ball.vx *= 0.996;
  ball.vy += G*dt;
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;

  checkHoop();

  // Out of bounds — reset
  if(ball.y > H+80 || ball.x < -80 || ball.x > W+80){
    if(!scored) { streak=0; updateHUD(); sndMiss(); }
    scored=false; ball.flying=false; resetBallPos();
  }
}

let scoreId=0;
function checkHoop(){
  if(scored) return;
  // Ball must be falling DOWN (vy > 0) to enter from above
  if(ball.vy <= 0) return;

  const ry = rim.y;
  const fromCenter = Math.abs(ball.x - rim.x);
  const clearance  = rim.w/2 - ball.r - 2;

  // Check if ball center is crossing the rim plane
  if(ball.y >= ry - ball.r && ball.y <= ry + ball.r + 8){
    if(fromCenter < clearance){
      // SWISH! Ball went cleanly through
      scored=true;
      made++;
      streak++;
      if(streak>maxStreak) maxStreak=streak;
      const pts = streak>=4?4:streak>=3?3:streak>=2?2:1;
      score += pts*100;
      const label = streak>=4?'🔥🔥 4PT!':streak>=3?'🔥 3PT!':streak>=2?'💫 2PT!':'✅ MASUK!';
      updateHUD();
      sndSwish();
      if(streak>=3) sndStreak();
      showPop(rim.x, ry-30, label, streak>=3?'#FF3CAC':streak>=2?'#FFD93D':'#39FF14');
      if(streak>=4) launchConf();
      // Let ball continue through net briefly before reset
      const sid=++scoreId;
      setTimeout(()=>{
        if(sid===scoreId && scored){ scored=false; ball.flying=false; resetBallPos(); }
      }, 400);
    } else if(fromCenter < rim.w/2 + ball.r + 4){
      // Hit rim — bounce off
      if(ball.x < rim.x){
        ball.vx = -Math.abs(ball.vx)*0.5;
      } else {
        ball.vx = Math.abs(ball.vx)*0.5;
      }
      ball.vy *= -0.4;
      sndBounce();
    }
  }
}

function updateHUD(){
  document.getElementById('sHud').textContent=score;
  const s = streak;
  document.getElementById('stHud').textContent = s>=3?'🔥'+s:s;
}

// =============================================
// DRAW
// =============================================
function draw(){
  ctx.clearRect(0,0,W,H);
  drawCrowd();
  drawCourt();
  drawRim();
  drawTrail();
  drawBall();
  drawAimGuide();
}

function drawCourt(){
  // Floor gradient
  const fy = H*0.68;
  const g=ctx.createLinearGradient(0,fy,0,H);
  g.addColorStop(0,'#C8860A'); g.addColorStop(.4,'#A06808'); g.addColorStop(1,'#7a4c04');
  ctx.fillStyle=g; ctx.fillRect(0,fy,W,H-fy);

  // Court lines
  ctx.strokeStyle='rgba(255,190,60,.22)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(W/2,H+40,W*.52,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
  const kw=W*.3,kh=H*.18;
  ctx.strokeRect(W/2-kw/2,fy-kh,kw,kh);
  ctx.beginPath(); ctx.arc(W/2,fy-kh,kw/2,0,Math.PI*2); ctx.stroke();

  // Backboard
  const bw=W*.36,bh=24,bx=rim.x-bw/2,by=rim.y-72;
  ctx.fillStyle='rgba(255,255,255,.1)'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,60,10,.5)';
  ctx.strokeRect(W/2-bw*.18,by+bh*.15,bw*.36,bh*.7);
  // Pole
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(W/2-3,by+bh,6,H-by-bh);
}

function drawCrowd(){
  crowd.forEach(p=>{
    p.w+=.025;
    ctx.beginPath(); ctx.arc(p.x,p.y+Math.sin(p.w)*2.5,p.r,0,Math.PI*2);
    ctx.globalAlpha=.45; ctx.fillStyle=p.col; ctx.fill(); ctx.globalAlpha=1;
  });
}

function drawRim(){
  const rx=rim.x,ry=rim.y,rw=rim.w;
  // Net
  const ns=8, nh=50;
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.2;
  for(let i=0;i<=ns;i++){
    const nx=rx-rw/2+i*(rw/ns);
    ctx.beginPath(); ctx.moveTo(nx,ry); ctx.lineTo(rx+(nx-rx)*.5,ry+nh); ctx.stroke();
  }
  for(let j=1;j<=4;j++){
    const t=j/4, nw2=rw*(1-t*.5);
    ctx.beginPath(); ctx.moveTo(rx-nw2/2,ry+nh*t); ctx.lineTo(rx+nw2/2,ry+nh*t); ctx.stroke();
  }
  // Rim shadow
  ctx.strokeStyle='#8B2500'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(rx-rw/2,ry+3); ctx.lineTo(rx+rw/2,ry+3); ctx.stroke();
  // Rim
  ctx.strokeStyle='#E8390A'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(rx-rw/2,ry); ctx.lineTo(rx+rw/2,ry); ctx.stroke();
  // End caps
  [rx-rw/2,rx+rw/2].forEach(ex=>{ ctx.beginPath(); ctx.arc(ex,ry,5,0,Math.PI*2); ctx.fillStyle='#E8390A'; ctx.fill(); });
  // Glow if moving
  if(DIFFS[diff].speed>0){
    ctx.shadowColor='#FF6B1A'; ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(255,107,26,.3)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(rx-rw/2,ry); ctx.lineTo(rx+rw/2,ry); ctx.stroke();
    ctx.shadowBlur=0;
  }
}

function drawBall(){
  const bx=ball.x, by=ball.y, br=ball.r;
  // Shadow on floor
  if(ball.y < H*0.68){
    const sy=H*0.70, dist=Math.max(1,(H*0.68-ball.y));
    const sa=Math.min(.5, 60/dist);
    ctx.beginPath(); ctx.ellipse(bx,sy,br*1.2,br*0.35,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,0,0,${sa*.6})`; ctx.fill();
  }
  // Ball
  const g=ctx.createRadialGradient(bx-br*.3,by-br*.3,br*.1,bx,by,br);
  g.addColorStop(0,'#FF9030'); g.addColorStop(.6,'#E05800'); g.addColorStop(1,'#8B2200');
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  // Seams
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx-br,by); ctx.bezierCurveTo(bx-br*.5,by-br*.5,bx+br*.5,by-br*.5,bx+br,by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx-br,by); ctx.bezierCurveTo(bx-br*.5,by+br*.5,bx+br*.5,by+br*.5,bx+br,by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx,by-br); ctx.bezierCurveTo(bx-br*.5,by-br*.5,bx-br*.5,by+br*.5,bx,by+br); ctx.stroke();
  // Shine
  ctx.beginPath(); ctx.arc(bx-br*.3,by-br*.3,br*.2,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fill();
}

function drawTrail(){
  ball.trail.forEach((p,i)=>{
    const t=i/ball.trail.length;
    ctx.beginPath(); ctx.arc(p.x,p.y,ball.r*t*.55,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,140,26,${t*.22})`; ctx.fill();
  });
}

function drawAimGuide(){
  if(!drag.on || ball.flying) return;
  const dx = drag.cx - drag.sx;
  const dy = drag.cy - drag.sy;
  if(dy > 20) return;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist<8) return;
  const angle = Math.atan2(dy,dx);
  const power = Math.min(dist,300);
  const spd = power*.058;

  // Dotted trajectory preview
  let px=ball.x, py=ball.y, pvx=Math.cos(angle)*spd, pvy=Math.sin(angle)*spd;
  ctx.beginPath(); ctx.setLineDash([5,9]); ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2;
  ctx.moveTo(px,py);
  for(let i=0;i<30;i++){
    pvx*=0.996; pvy+=G;
    px+=pvx; py+=pvy;
    ctx.lineTo(px,py);
    if(py>H*.87||px<0||px>W) break;
  }
  ctx.stroke(); ctx.setLineDash([]);

  // Arrow from ball
  const tipX=ball.x+Math.cos(angle)*Math.min(power*.5,120);
  const tipY=ball.y+Math.sin(angle)*Math.min(power*.5,120);
  const alpha=0.4+power/300*.6;
  ctx.strokeStyle=`rgba(255,217,61,${alpha})`; ctx.lineWidth=3; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(tipX,tipY); ctx.stroke(); ctx.setLineDash([]);
  // Arrowhead
  ctx.fillStyle=`rgba(255,217,61,${alpha})`;
  ctx.beginPath();
  ctx.moveTo(tipX+Math.cos(angle)*10,tipY+Math.sin(angle)*10);
  ctx.lineTo(tipX+Math.cos(angle+2.6)*8,tipY+Math.sin(angle+2.6)*8);
  ctx.lineTo(tipX+Math.cos(angle-2.6)*8,tipY+Math.sin(angle-2.6)*8);
  ctx.closePath(); ctx.fill();
}

// =============================================
// SCORE POPUP
// =============================================
function showPop(x,y,txt,col){
  const p=document.createElement('div');
  p.className='spop'; p.textContent=txt; p.style.color=col;
  p.style.left=(x-40)+'px'; p.style.top=(y-10)+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),900);
}

// =============================================
// CONFETTI
// =============================================
const ccv=document.getElementById('confCv');
const cctx=ccv.getContext('2d');
let cp=[],cr=null;
function launchConf(){
  ccv.width=W; ccv.height=H; cp=[];
  const cols=['#FF6B1A','#FFD93D','#FF3CAC','#39FF14','#4ECDC4'];
  for(let i=0;i<120;i++) cp.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*7,vy:2+Math.random()*5,r:4+Math.random()*7,col:cols[i%cols.length],rot:Math.random()*360,rv:(Math.random()-.5)*12});
  cancelAnimationFrame(cr); animC();
  setTimeout(()=>{cancelAnimationFrame(cr);cctx.clearRect(0,0,W,H);},4000);
}
function animC(){
  cctx.clearRect(0,0,W,H);
  cp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.rot+=p.rv;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot*Math.PI/180);cctx.fillStyle=p.col;cctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cctx.restore();});
  cp=cp.filter(p=>p.y<H+30);
  if(cp.length>0) cr=requestAnimationFrame(animC);
}

// =============================================
// END
// =============================================
function endGame(){
  clearInterval(tInt);
  document.getElementById('hud').style.display='none';
  document.getElementById('hint').style.display='none';
  if(score>best){ best=score; document.getElementById('bestDisp').textContent=best; }
  const acc=shots>0?Math.round(made/shots*100):0;
  const title=score>=3000?'LEGEND! 🏆':score>=2000?'MANTAP! 🔥':score>=1000?'BAGUS! 💫':'SEMANGAT! 💪';
  document.getElementById('rTitle').textContent=title;
  document.getElementById('rScore').textContent=score;
  document.getElementById('rMasuk').textContent=made;
  document.getElementById('rMiss').textContent=shots-made;
  document.getElementById('rAcc').textContent=acc+'%';
  document.getElementById('rStr').textContent=maxStreak;
  if(score>=2000){ sndWin(); launchConf(); } else sndMiss();
  document.getElementById('resBg').classList.add('on');
}

function hideScreens(){
  document.getElementById('menuBg').classList.remove('on');
  document.getElementById('resBg').classList.remove('on');
}
function goMenu(){
  clearInterval(tInt); gameOn=false; ball.flying=false; drag.on=false;
  document.getElementById('hud').style.display='none';
  document.getElementById('hint').style.display='none';
  hideScreens();
  document.getElementById('menuBg').classList.add('on');
}

window.addEventListener('touchstart',()=>{try{ac();}catch(e){}},{once:false});
